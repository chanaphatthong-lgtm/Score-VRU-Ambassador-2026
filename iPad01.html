<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Judge Screen - VRU Ambassador 2025</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- โหลดฟอนต์ Inter และ Kanit จาก Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Kanit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- MQTT SDK รับสัญญาณข้ามเครื่องผ่าน WebSocket -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    
    <style>
        /* กำหนดให้ตัวอักษรภาษาอังกฤษ (A-Z, a-z) ใช้ Inter ส่วนตัวเลขและภาษาไทยใช้ Kanit */
        @font-face {
            font-family: 'Inter-Latin';
            src: local('Inter');
            unicode-range: U+0041-005A, U+0061-007A;
        }

        /* ล็อกหน้าจอ ป้องกันการเลื่อน/ซูม/เลือกข้อความ */
        html, body {
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            overscroll-behavior: none;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        body {
            font-family: 'Inter-Latin', 'Kanit', sans-serif;
            background: linear-gradient(135deg, #f0f7ff 0%, #d9ecff 100%);
            transition: background 0.4s ease, color 0.4s ease;
        }

        /* อนุญาตให้เลือกและพิมพ์ได้เฉพาะช่องกรอก */
        input, select {
            -webkit-user-select: auto !important;
            user-select: auto !important;
            font-family: 'Inter-Latin', 'Kanit', sans-serif;
        }

        /* สไตล์กระจกใสทั่วไป (Light Mode) */
        .liquid-glass {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
            transition: all 0.4s ease;
        }
        
        /* สไตล์กระจกขาวสว่าง (สำหรับกล่อง Modal ทั่วไป) */
        .modal-glass {
            background: rgba(255, 255, 255, 0.88); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 15px 40px 0 rgba(31, 38, 135, 0.15);
            transition: all 0.4s ease;
        }

        /* ----------------------------------------------------------------- */
        /* 🎨 สไตล์การ์ดล็อกอิน (LOGIN MODAL THEME) */
        /* ----------------------------------------------------------------- */
        .login-card-theme {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.2);
        }
        .login-card-theme .login-title { color: #1e3a8a; }
        .login-card-theme .login-subtitle { color: #64748b; }
        .login-card-theme .login-label { color: #1e3a8a; }
        .login-card-theme .login-input {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #bfdbfe;
            color: #1e293b;
        }
        .login-card-theme .login-input:focus { border-color: #2563eb; }
        .login-card-theme .login-btn {
            background: #1e3a8a;
            color: #ffffff;
        }
        .login-card-theme .login-btn:hover { background: #1d4ed8; }

        .glass-button:active {
            transform: scale(0.97);
        }
        
        /* ซ่อนลูกศรในช่องกรอกตัวเลข */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        /* แอนิเมชันเส้นปาดเอียง 45 องศา */
        .animate-wipe-diagonal {
            animation: wipeDiagonalReveal 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        
        @keyframes wipeDiagonalReveal {
            0% {
                clip-path: polygon(0 0, -20% 0, -50% 100%, 0 100%);
                transform: translateX(-30px); 
                opacity: 0;
            }
            100% {
                clip-path: polygon(0 0, 150% 0, 120% 100%, 0 100%);
                transform: translateX(0); 
                opacity: 1;
            }
        }

        /* ----------------------------------------------------------------- */
        /* 🌙 DARK MODE STYLES */
        /* ----------------------------------------------------------------- */
        body.dark-mode {
            background: linear-gradient(135deg, #0b0f19 0%, #111827 100%);
            color: #f1f5f9;
        }

        body.dark-mode .liquid-glass {
            background: rgba(17, 24, 39, 0.65);
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        body.dark-mode .modal-glass {
            background: rgba(17, 24, 39, 0.92);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 15px 40px 0 rgba(0, 0, 0, 0.7);
        }

        body.dark-mode .login-card-theme {
            background: rgba(15, 23, 42, 0.92);
            border-color: rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
        }
        body.dark-mode .login-card-theme .login-title { color: #93c5fd; }
        body.dark-mode .login-card-theme .login-subtitle { color: #94a3b8; }
        body.dark-mode .login-card-theme .login-label { color: #93c5fd; }
        body.dark-mode .login-card-theme .login-input {
            background: rgba(30, 41, 59, 0.9);
            border: 2px solid #334155;
            color: #f8fafc;
        }
        body.dark-mode .login-card-theme .login-input:focus { border-color: #3b82f6; }
        body.dark-mode .login-card-theme .login-btn {
            background: #2563eb;
            color: #ffffff;
        }
        body.dark-mode .login-card-theme .login-btn:hover { background: #1d4ed8; }

        body.dark-mode .header-bg-box {
            background: rgba(31, 41, 55, 0.7) !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
            color: #f3f4f6 !important;
        }

        body.dark-mode .criterion-card {
            background: rgba(31, 41, 55, 0.5) !important;
            border-color: rgba(255, 255, 255, 0.08) !important;
        }

        body.dark-mode .criterion-name {
            color: #f3f4f6 !important;
        }

        body.dark-mode .score-input {
            background: rgba(17, 24, 39, 0.9) !important;
            border-color: #3b82f6 !important;
            color: #60a5fa !important;
        }

        body.dark-mode h1, 
        body.dark-mode h3, 
        body.dark-mode #device-id-text, 
        body.dark-mode #display-judge-name {
            color: #93c5fd !important;
        }

        body.dark-mode h2 {
            color: #cbd5e1 !important;
        }

        body.dark-mode #waiting-title {
            color: #93c5fd !important;
        }

        body.dark-mode #waiting-text {
            color: #9ca3af !important;
        }

        body.dark-mode #icon-container {
            background: #1f2937 !important;
            color: #60a5fa !important;
        }

        body.dark-mode #display-nickname {
            background: rgba(31, 41, 55, 0.9) !important;
            border-color: #3b82f6 !important;
            color: #93c5fd !important;
        }

        body.dark-mode #display-round {
            background: rgba(30, 58, 138, 0.5) !important;
            color: #bfdbfe !important;
            border-color: rgba(96, 165, 250, 0.3) !important;
        }
    </style>
</head>
<body class="text-slate-800 p-6 flex flex-col h-screen overflow-hidden select-none">

    <!-- OVERLAY 1: หน้าจอล็อกอินเข้าใช้งานเครื่องกรรมการ -->
    <div id="login-overlay" class="fixed inset-0 bg-slate-950/75 backdrop-blur-2xl z-[100] flex items-center justify-center p-6 transition-all duration-500">
        <div class="login-card-theme w-full max-w-[580px] p-10 md:p-12 rounded-[2.5rem] shadow-2xl text-center flex flex-col items-center">
            
            <!-- โลโก้งาน -->
            <div class="w-48 h-48 mb-4 flex items-center justify-center shrink-0">
                <img id="event-logo" src="logo.png" alt="Logo" class="w-full h-full object-contain filter drop-shadow-xl" onError="this.onerror=null; this.src='https://img.icons8.com/color/144/scales.png';">
            </div>

            <h2 class="login-title text-3xl font-black mb-1.5 leading-tight">เข้าสู่ระบบกรรมการ</h2>

            <form id="login-form" class="w-full space-y-5 text-left">
                <div>
                    <label class="login-label block text-sm font-bold mb-2">หมายเลขเครื่องกรรมการ</label>
                    <select id="login-device-select" class="login-input w-full h-14 rounded-2xl px-5 text-lg font-bold outline-none transition-all shadow-inner">
                        <option value="iPad 01">iPad 01</option>
                        <option value="iPad 02">iPad 02</option>
                        <option value="iPad 03">iPad 03</option>

                        <option value="iPad 05">iPad 05</option>
                    </select>

                <div>

                    <select id="login-judge-select" required class="login-input w-full h-14 rounded-2xl px-5 text-lg font-bold outline-none transition-all shadow-inner">

                <button type="submit" class="login-btn glass-button w-full h-14 font-bold text-xl rounded-2xl shadow-xl transition-all active:scale-95 mt-4 flex items-center justify-center gap-3">
                    <span>เข้าสู่ระบบประเมิน</span>
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </form>
        </div>
    </div>

    <!-- OVERLAY 2: หน้าจอล็อกรอแอดมิน -->
    <div id="waiting-overlay" class="fixed inset-0 bg-slate-950/60 backdrop-blur-xl z-50 flex items-center justify-center transition-opacity duration-700">
        <div id="waiting-modal" class="modal-glass w-[460px] h-[320px] rounded-3xl flex flex-col items-center justify-center text-center mt-20 transition-all duration-700 ease-in-out transform translate-y-0 px-8">
            <div id="icon-container" class="w-20 h-20 bg-white shadow-md text-blue-600 rounded-full flex items-center justify-center mb-6 transition-transform duration-300 shrink-0 relative">
                <svg id="icon-lock" class="w-10 h-10 transition-opacity duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
                <svg id="icon-unlock" class="w-10 h-10 absolute opacity-0 transition-opacity duration-300 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2 2v6a2 2 0 002 2z"></path>

    <!-- HEADER -->
    <nav class="relative z-[60] liquid-glass rounded-3xl p-5 mb-5 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-5">
            <div id="profile-group" class="flex flex-col items-center shrink-0">

            </div>

            <div class="flex flex-col justify-center">
                <div id="display-round-wrapper" class="mb-1">

                </div>

        <div class="flex items-center gap-3">

            <div class="header-bg-box bg-white/70 px-4 h-12 rounded-2xl border border-white shadow-sm flex items-center gap-2.5">

                <div id="device-id-text" class="text-base font-black text-blue-900">iPad 01</div>

            <div class="header-bg-box bg-white/70 px-6 h-12 rounded-2xl border border-white shadow-sm flex items-center justify-center gap-3">

                <button id="logout-btn" title="ออกจากระบบ / สลับชื่อ" class="text-xs bg-rose-500/10 hover:bg-rose-500/20 text-rose-600 font-bold px-2.5 py-1 rounded-xl transition-all border border-rose-200/50 active:scale-95">
                    🚪 สลับเครื่อง
                </button>
            </div>
        </div>
    </nav>

    <!-- MAIN SCORING PANEL -->
    <main class="relative z-40 liquid-glass rounded-3xl p-6 flex-1 flex flex-col min-h-0">
        <div class="flex justify-between items-center mb-4 shrink-0 gap-4">
            <h3 class="text-lg font-bold text-blue-900 flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                แบบประเมินให้คะแนน
            </h3>

            <button id="submit-btn" class="glass-button bg-blue-900 hover:bg-blue-800 text-white font-bold text-lg px-7 py-3 rounded-2xl shadow-md transition-all flex items-center gap-2 shrink-0">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                บันทึกคะแนนและส่ง
            </button>
        </div>

        <div id="criteria-container" class="grid grid-cols-1 md:grid-cols-2 gap-4 overflow-y-auto pr-2 pb-2 flex-1">
        </div>
    </main>

    <!-- Script -->
    <script>
        // URL สำหรับบันทึกคะแนน Google Apps Script สำรอง
        const DEFAULT_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzQzsoTBE0rxF9wzFs8DJtlqUFqub80gLXb83lJ5xNVphXlGpQwttm4IkJtOAZ6HF_Lyg/exec';

        // -----------------------------------------------------------------
        // Google Sheet รหัสคณะกรรมการ
        // -----------------------------------------------------------------
        const PASSWORD_SHEET_ID = '1wXJcgOcb7-AB3LyzH-NejVgNLQ8JxCbEJ_vHta780r0';
        const PASSWORD_SHEET_NAME = 'รหัสคณะกรรมการ';

        // 📌 ตั้งค่าแยก GOOGLE SHEET ID และ Web App URL สำหรับแต่ละเครื่อง
        const JUDGE_CONFIGS = {
            'iPad 01': { 
                sheetId: '1mQ0ZMdVzkJe6Jgma9m9rn-tZ-otMVQf4ame_5i_3rR8',
                scriptUrl: 'https://script.google.com/macros/s/AKfycbzQzsoTBE0rxF9wzFs8DJtlqUFqub80gLXb83lJ5xNVphXlGpQwttm4IkJtOAZ6HF_Lyg/exec'
            },
            'iPad 02': { 
                sheetId: '1ChJNDGBQ3E1yMImjU30RjVjShPtiXX3psMb2NQhc14Q',
                scriptUrl: 'https://script.google.com/macros/s/AKfycbx9GyYcrQrsDmvr1h9Y51cjRHthwFpJQlP4XliF-PxtBulp5Ur6NJ2zPUsHYCFndXCC/exec'
            },
            'iPad 03': { sheetId: 'วาง_SHEET_ID_กรรมการ_3_ตรงนี้', scriptUrl: '' },
            'iPad 04': { sheetId: 'วาง_SHEET_ID_กรรมการ_4_ตรงนี้', scriptUrl: '' },
            'iPad 05': { sheetId: 'วาง_SHEET_ID_กรรมการ_5_ตรงนี้', scriptUrl: '' }
        };

        let DEVICE_ID = 'iPad 01';
        let CURRENT_SHEET_ID = JUDGE_CONFIGS['iPad 01'].sheetId;
        let CURRENT_SCRIPT_URL = JUDGE_CONFIGS['iPad 01'].scriptUrl || DEFAULT_SCRIPT_URL;
        
        // ข้อมูลกรรมการที่ดึงมาจาก Google Sheet
        let fetchedJudgesList = []; 

        // -----------------------------------------------------------------
        // ดึงข้อมูลรายชื่อกรรมการ + รหัสผ่าน จาก Google Sheet "รหัสคณะกรรมการ"
        // -----------------------------------------------------------------
        async function fetchJudgeCredentials() {
            try {
                const gvizUrl = `https://docs.google.com/spreadsheets/d/${PASSWORD_SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(PASSWORD_SHEET_NAME)}`;
                const response = await fetch(gvizUrl);
                const text = await response.text();
                
                const jsonString = text.substring(47, text.length - 2);
                const data = JSON.parse(jsonString);

                fetchedJudgesList = [];

                if (data.table && data.table.rows) {
                    data.table.rows.forEach(row => {
                        if (row.c && row.c[0] && row.c[0].v) {
                            const dev = String(row.c[0].v || '').trim();
                            const rawName = String(row.c[1] ? (row.c[1].v || '') : '').trim();
                            const pwd = String(row.c[2] ? (row.c[2].v || '') : '').trim();

                            // ✂️ ตัดเครื่องหมาย () ออกจากชื่อทั้งหมด
                            const cleanName = rawName.replace(/\s*\([^)]*\)/g, '').trim();

                            if (dev && !dev.includes('อุปกรณ์')) {
                                fetchedJudgesList.push({ device: dev, name: cleanName, password: pwd });
                            }
                        }
                    });
                }

                renderJudgeSelectOptions();

            } catch (err) {
                console.error("เกิดข้อผิดพลาดในการดึงข้อมูลรหัสผ่าน:", err);
            }
        }

        // แสดงรายชื่อกรรมการลงใน Dropdown (<select>) แบบไม่มี ()
        function renderJudgeSelectOptions() {
            const loginJudgeSelect = document.getElementById('login-judge-select');
            const selectedDev = document.getElementById('login-device-select').value;

            if (fetchedJudgesList.length === 0) {
                loginJudgeSelect.innerHTML = `<option value="">ไม่พบรายชื่อกรรมการในชีท</option>`;
                return;
            }

            loginJudgeSelect.innerHTML = '';
            let matchedJudgeName = '';

            fetchedJudgesList.forEach(item => {
                const isMatchDev = item.device.toLowerCase().replace(/\s+/g, '') === selectedDev.toLowerCase().replace(/\s+/g, '');
                if (isMatchDev && !matchedJudgeName) matchedJudgeName = item.name;

                const opt = document.createElement('option');
                opt.value = item.name;
                opt.textContent = item.name;
                opt.dataset.device = item.device;
                opt.dataset.password = item.password;
                loginJudgeSelect.appendChild(opt);
            });

            if (matchedJudgeName) {
                loginJudgeSelect.value = matchedJudgeName;
            }
        }

        // -----------------------------------------------------------------
        // ระบบสลับโหมดมืด Dark Mode
        // -----------------------------------------------------------------
        const themeToggleBtn = document.getElementById('theme-toggle-btn');
        const themeIconMoon = document.getElementById('theme-icon-moon');
        const themeIconSun = document.getElementById('theme-icon-sun');

        function enableDarkMode(isDark) {
            if (isDark) {
                document.body.classList.add('dark-mode');
                themeIconMoon.classList.add('hidden');
                themeIconSun.classList.remove('hidden');
                localStorage.setItem('ipad_theme', 'dark');
            } else {
                document.body.classList.remove('dark-mode');
                themeIconMoon.classList.remove('hidden');
                themeIconSun.classList.add('hidden');
                localStorage.setItem('ipad_theme', 'light');
            }
        }

        themeToggleBtn.addEventListener('click', () => {
            const isDark = !document.body.classList.contains('dark-mode');
            enableDarkMode(isDark);
        });

        if (localStorage.getItem('ipad_theme') === 'dark') {
            enableDarkMode(true);
        }

        // -----------------------------------------------------------------
        // ระบบล็อกอินเข้าใช้งานกรรมการ + ตรวจสอบรหัสผ่านกับชีท
        // -----------------------------------------------------------------
        const loginOverlay = document.getElementById('login-overlay');
        const loginForm = document.getElementById('login-form');
        const loginDeviceSelect = document.getElementById('login-device-select');
        const loginJudgeSelect = document.getElementById('login-judge-select');
        const loginPasswordInput = document.getElementById('login-password');
        const loginErrorMsg = document.getElementById('login-error-msg');
        const logoutBtn = document.getElementById('logout-btn');

        loginDeviceSelect.addEventListener('change', () => {
            loginErrorMsg.classList.add('hidden');
            renderJudgeSelectOptions();
        });

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const devId = loginDeviceSelect.value;
            const selectedJudgeName = loginJudgeSelect.value;
            const inputPwd = loginPasswordInput.value.trim();

            loginErrorMsg.classList.add('hidden');

            const targetJudge = fetchedJudgesList.find(j => j.name === selectedJudgeName);

            if (targetJudge && targetJudge.password && inputPwd !== targetJudge.password) {
                loginErrorMsg.textContent = '⚠️ รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง';
                loginErrorMsg.classList.remove('hidden');
                return;
            }

            if (!devId || !selectedJudgeName) return;

            DEVICE_ID = devId;
            CURRENT_SHEET_ID = JUDGE_CONFIGS[devId] ? JUDGE_CONFIGS[devId].sheetId : '';
            CURRENT_SCRIPT_URL = (JUDGE_CONFIGS[devId] && JUDGE_CONFIGS[devId].scriptUrl) ? JUDGE_CONFIGS[devId].scriptUrl : DEFAULT_SCRIPT_URL;

            localStorage.setItem('logged_judge_device', devId);
            localStorage.setItem('logged_judge_name', selectedJudgeName);

            applyLoggedInUser(devId, selectedJudgeName);

            loginOverlay.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                loginOverlay.classList.add('hidden');
            }, 500);
        });

        function applyLoggedInUser(devId, jName) {
            deviceIdText.textContent = devId;
            displayJudgeName.textContent = jName;
            
            sendHeartbeat();
            loadCriteriaForRound('รอบที่ 1');
        }

        function checkExistingLogin() {
            const savedDev = localStorage.getItem('logged_judge_device');
            const savedName = localStorage.getItem('logged_judge_name');

            if (savedDev && savedName && JUDGE_CONFIGS[savedDev]) {
                DEVICE_ID = savedDev;
                CURRENT_SHEET_ID = JUDGE_CONFIGS[savedDev].sheetId;
                CURRENT_SCRIPT_URL = JUDGE_CONFIGS[savedDev].scriptUrl || DEFAULT_SCRIPT_URL;
                loginDeviceSelect.value = savedDev;

                applyLoggedInUser(savedDev, savedName);
                loginOverlay.classList.add('hidden');
            }
        }

        logoutBtn.addEventListener('click', () => {
            if (confirm('คุณต้องการออกจากระบบเพื่อสลับเครื่องหรือสลับชื่อกรรมการใช่หรือไม่?')) {
                localStorage.removeItem('logged_judge_device');
                localStorage.removeItem('logged_judge_name');
                loginPasswordInput.value = '';
                loginErrorMsg.classList.add('hidden');
                loginOverlay.classList.remove('hidden', 'opacity-0', 'pointer-events-none');
            }
        });

        // -----------------------------------------------------------------
        // ระบบป้องกันการซูมและการลากหน้าจอบน iPad
        // -----------------------------------------------------------------
        document.addEventListener('gesturestart', (e) => e.preventDefault());
        document.addEventListener('touchmove', (e) => {
            if (e.scale !== 1) e.preventDefault();
        }, { passive: false });

        const overlay = document.getElementById('waiting-overlay');
        const waitingModal = document.getElementById('waiting-modal');
        const waitingTitle = document.getElementById('waiting-title');
        const waitingText = document.getElementById('waiting-text');
        const submitBtn = document.getElementById('submit-btn');
        const iconLock = document.getElementById('icon-lock');
        const iconUnlock = document.getElementById('icon-unlock');
        const iconContainer = document.getElementById('icon-container');
        
        const displayRoundNode = document.getElementById('display-round');
        const displayRoundWrapper = document.getElementById('display-round-wrapper');
        const profileCircle = document.getElementById('profile-circle');
        const displayNicknameNode = document.getElementById('display-nickname');
        const displayNicknameWrapper = document.getElementById('display-nickname-wrapper');
        const contestantDetailsWrapper = document.getElementById('contestant-details-wrapper');
        const criteriaContainer = document.getElementById('criteria-container');

        const connDot = document.getElementById('conn-dot');
        const connText = document.getElementById('conn-text');
        const deviceIdText = document.getElementById('device-id-text');
        const displayJudgeName = document.getElementById('display-judge-name');

        let currentContestantCode = '';

        // -----------------------------------------------------------------
        // โครงสร้างแผนผังการดึงข้อมูลเกณฑ์การให้คะแนน
        // -----------------------------------------------------------------
        const ROUND_CONFIGS = {
            'รอบที่ 1': { sheet: 'รอบที่ 1', ranges: ['D11:F11', 'G10:I10'] },
            'รอบที่ 2': { sheet: 'รอบที่ 2', ranges: ['D10:G10'] },
            'รอบที่ 3': { sheet: 'รอบที่ 3', ranges: ['D10', 'E11:G11', 'H10'] },
            'รอบที่ 4': { sheet: 'รอบที่ 4', ranges: ['D11:H11', 'I10'] },
            'รอบที่ 5': { sheet: 'รอบที่ 5', ranges: ['D11:H11', 'I10'] }
        };

        async function fetchSingleRange(sheetName, range) {
            try {
                if (!CURRENT_SHEET_ID || CURRENT_SHEET_ID.includes('วาง_SHEET_ID')) {
                    console.warn('ยังไม่ได้ระบุ Sheet ID ของกรรมการเครื่องนี้');
                    return [];
                }

                const gvizUrl = `https://docs.google.com/spreadsheets/d/${CURRENT_SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}&range=${encodeURIComponent(range)}`;
                const response = await fetch(gvizUrl);
                const text = await response.text();
                
                const jsonString = text.substring(47, text.length - 2);
                const data = JSON.parse(jsonString);
                
                let results = [];
                if (data.table && data.table.rows && data.table.rows.length > 0) {
                    const cells = data.table.rows[0].c;
                    cells.forEach(cell => {
                        if (cell) {
                            const val = cell.f || cell.v || '';
                            if (val !== '') results.push(String(val));
                        }
                    });
                }
                return results;
            } catch (err) {
                console.error(`Error fetching range ${sheetName}!${range}:`, err);
                return [];
            }
        }

        async function loadCriteriaForRound(roundName) {
            let matchedKey = Object.keys(ROUND_CONFIGS).find(key => roundName.includes(key)) || 'รอบที่ 1';
            const config = ROUND_CONFIGS[matchedKey];

            let allCriteria = [];
            for (const range of config.ranges) {
                const rangeItems = await fetchSingleRange(config.sheet, range);
                allCriteria = allCriteria.concat(rangeItems);
            }

            if (allCriteria.length > 0) {
                renderCriteria(allCriteria);
            }
        }

        function renderCriteria(criteriaList) {
            criteriaContainer.innerHTML = '';
            criteriaList.forEach((criterionName) => {
                const matchScore = criterionName.match(/\((\d+)\s*คะแนน\)/) || criterionName.match(/\((\d+)\)/);
                const maxScore = matchScore ? parseFloat(matchScore[1]) : 10;

                const cardHTML = `
                    <div class="criterion-card bg-white/70 border border-white p-4 rounded-2xl shadow-sm flex justify-between items-center hover:shadow-md transition-shadow gap-3">
                        <div class="flex-1 flex flex-col justify-center">
                            <h4 class="criterion-name text-lg font-bold text-slate-800 leading-tight">${criterionName}</h4>
                        </div>
                        <div class="w-32 shrink-0 flex flex-col items-center justify-center">
                            <input type="number" inputmode="decimal" step="any" min="0" max="${maxScore}" placeholder="0" class="score-input w-full h-full min-h-[5rem] text-center text-5xl font-black text-blue-900 bg-white border-2 border-blue-200 rounded-2xl focus:border-blue-500 focus:ring-4 focus:ring-blue-100 outline-none transition-all shadow-inner">
                        </div>
                    </div>
                `;
                criteriaContainer.insertAdjacentHTML('beforeend', cardHTML);
            });
            setupScoreValidation();
        }

        function setupScoreValidation() {
            const scoreInputs = document.querySelectorAll('.score-input');
            scoreInputs.forEach(input => {
                input.addEventListener('input', function() {
                    if (this.value === '') return;
                    let val = parseFloat(this.value);
                    let maxScore = parseFloat(this.getAttribute('max')) || 10; 
                    if (isNaN(val)) return;
                    if (val > maxScore) this.value = maxScore;
                    else if (val < 0) this.value = 0;
                });

                input.addEventListener('blur', function() {
                    if (this.value === '') return;
                    let val = parseFloat(this.value);
                    let maxScore = parseFloat(this.getAttribute('max')) || 10;
                    if (isNaN(val) || val < 0) this.value = 0;
                    else if (val > maxScore) this.value = maxScore;
                });
            });
        }

        // -----------------------------------------------------------------
        // ระบบรวบรวมคะแนนและส่งไปยัง Google Sheets
        // -----------------------------------------------------------------
        submitBtn.addEventListener('click', async () => {
            iconLock.classList.remove('opacity-0');
            iconUnlock.classList.add('opacity-0');
            iconContainer.classList.remove('scale-110');
            waitingTitle.classList.remove('text-green-600');
            
            waitingTitle.textContent = "กำลังบันทึกคะแนน...";
            waitingText.textContent = "กำลังส่งข้อมูลเข้า Google Sheet...";
            
            overlay.style.display = 'flex';
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                waitingModal.classList.remove('-translate-y-[100vh]'); 
            }, 50);

            const scoreInputs = document.querySelectorAll('.score-input');
            const scoresList = [];
            scoreInputs.forEach(input => {
                const val = parseFloat(input.value);
                scoresList.push(isNaN(val) ? 0 : val);
            });

            const currentRound = displayRoundNode.textContent.trim();

            const payload = {
                judgeId: DEVICE_ID,
                judgeName: displayJudgeName ? displayJudgeName.textContent.trim() : '',
                sheetId: CURRENT_SHEET_ID,
                roundName: currentRound,
                contestantCode: currentContestantCode,
                scores: scoresList
            };

            try {
                const targetScriptUrl = CURRENT_SCRIPT_URL || DEFAULT_SCRIPT_URL;
                if (targetScriptUrl && targetScriptUrl.startsWith('http')) {
                    await fetch(targetScriptUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                }
                
                waitingTitle.textContent = "ส่งคะแนนเรียบร้อย!";
                waitingText.textContent = "กำลังรอผู้ควบคุมเปิดระบบสำหรับคนถัดไป...";

            } catch (err) {
                console.error("เกิดข้อผิดพลาดในการบันทึกคะแนน:", err);
                waitingTitle.textContent = "บันทึกเรียบร้อย";
                waitingText.textContent = "กำลังรอผู้ควบคุมเปิดระบบสำหรับคนถัดไป...";
            }
        });

        // -----------------------------------------------------------------
        // ประมวลผลคำสั่งจาก Admin Console
        // -----------------------------------------------------------------
        const pageLoadTime = Date.now();
        let lastProcessedTime = pageLoadTime;

        async function processAdminCommand(command) {
            if (!command || !command.timestamp || command.timestamp <= lastProcessedTime) return;
            lastProcessedTime = command.timestamp;

            if (command.action === 'START_VOTING') {
                currentContestantCode = command.contestantCode || '';

                const nameParts = (command.contestantName || '').split(' - ');
                const numberStr = nameParts[0] || '-'; 
                let nameStr = nameParts[1] || ''; 
                const justNumber = numberStr.replace(/\D/g, ''); 

                let nicknameStr = command.contestantNickname || command.nickname || '';
                const matchParen = nameStr.match(/\(([^)]+)\)/);
                if (matchParen) {
                    nicknameStr = matchParen[1];
                    nameStr = nameStr.replace(/\s*\([^)]+\)/, '').trim();
                }
                
                const currentRoundText = displayRoundNode.textContent.trim();
                const newRoundText = command.roundName || 'รอบที่ 1';
                const isRoundChanged = currentRoundText !== newRoundText;

                if (isRoundChanged) {
                    await loadCriteriaForRound(newRoundText);
                }
                
                let elementsToAnimate = [profileCircle, displayNicknameWrapper, contestantDetailsWrapper];
                if (isRoundChanged) {
                    elementsToAnimate.push(displayRoundWrapper);
                }
                
                elementsToAnimate.forEach(el => {
                    if (el) {
                        el.style.transition = 'opacity 0.3s ease';
                        el.style.opacity = '0';
                    }
                });
                
                iconLock.classList.add('opacity-0');
                iconUnlock.classList.remove('opacity-0');
                iconContainer.classList.add('scale-110');
                waitingTitle.classList.add('text-green-600');
                waitingTitle.textContent = "ปลดล็อกแล้ว";
                waitingText.textContent = "เตรียมแสดงข้อมูลผู้เข้าแข่งขัน...";
                
                document.querySelectorAll('.score-input').forEach(input => input.value = '');

                setTimeout(() => {
                    if (isRoundChanged) {
                        displayRoundNode.textContent = newRoundText;
                    }
                    
                    document.getElementById('display-number').textContent = numberStr;
                    document.getElementById('display-name').textContent = nameStr;
                    
                    displayNicknameNode.textContent = nicknameStr ? nicknameStr : '-';
                    
                    const imageUrl = command.contestantImage || command.imageUrl;
                    if (imageUrl) {
                        profileCircle.innerHTML = `<img src="${imageUrl}" class="w-full h-full object-cover rounded-full" alt="${justNumber}">`;
                    } else {
                        profileCircle.textContent = justNumber || '?';
                    }
                    
                    elementsToAnimate.forEach(el => {
                        if (el) {
                            el.style.transition = '';
                            el.style.opacity = '';
                            el.classList.remove('animate-wipe-diagonal');
                            void el.offsetWidth; 
                            el.classList.add('animate-wipe-diagonal');
                        }
                    });
                    
                    waitingText.textContent = "เชิญเริ่มการให้คะแนนได้";

                    setTimeout(() => {
                        overlay.style.display = 'none';
                        waitingTitle.textContent = "กรุณารอสักครู่";
                        waitingText.textContent = "รอผู้ควบคุมเปิดระบบรับคะแนน...";
                        waitingTitle.classList.remove('text-green-600');
                    }, 500); 
                    
                }, 300); 
            } 
            else if (command.action === 'LOCK_SCREEN') {
                iconLock.classList.remove('opacity-0');
                iconUnlock.classList.add('opacity-0');
                iconContainer.classList.remove('scale-110');
                waitingTitle.classList.remove('text-green-600');
                
                waitingTitle.textContent = "ล็อกหน้าจอแล้ว";
                waitingText.textContent = "ผู้ควบคุมสั่งล็อกหน้าจอรับคะแนน...";
                
                overlay.style.display = 'flex';
                setTimeout(() => {
                    overlay.classList.remove('opacity-0');
                    waitingModal.classList.remove('-translate-y-[100vh]'); 
                }, 50);
            }
        }

        // -----------------------------------------------------------------
        // ระบบ MQTT Real-time Receiver & Heartbeat Sender
        // -----------------------------------------------------------------
        const CMD_TOPIC = 'vru_pageant_2025/admin_cmd';
        const STATUS_TOPIC = 'vru_pageant_2025/device_status';

        const mqttClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');

        mqttClient.on('connect', () => {
            console.log('✅ iPad MQTT Connected!');
            connDot.className = "w-3 h-3 rounded-full bg-green-500 animate-pulse shadow-[0_0_8px_rgba(34,197,94,0.8)]";
            connText.className = "text-xs font-bold text-green-600 uppercase tracking-wide";
            connText.textContent = "เชื่อมต่อแล้ว";

            mqttClient.subscribe(CMD_TOPIC, { qos: 1 });

            sendHeartbeat();
            setInterval(sendHeartbeat, 3000);
        });

        function sendHeartbeat() {
            if (mqttClient && mqttClient.connected) {
                const statusPayload = {
                    deviceId: DEVICE_ID,
                    judgeName: displayJudgeName ? displayJudgeName.textContent.trim() : '',
                    timestamp: Date.now()
                };
                mqttClient.publish(STATUS_TOPIC, JSON.stringify(statusPayload), { qos: 0 });
            }
        }

        mqttClient.on('message', (topic, message) => {
            if (topic === CMD_TOPIC) {
                try {
                    const command = JSON.parse(message.toString());
                    processAdminCommand(command);
                } catch (err) {
                    console.error('JSON Error:', err);
                }
            }
        });

        mqttClient.on('error', (err) => {
            console.error('MQTT Connection Error:', err);
            connDot.className = "w-3 h-3 rounded-full bg-red-500 animate-pulse";
            connText.className = "text-xs font-bold text-red-600 uppercase tracking-wide";
            connText.textContent = "ขาดการเชื่อมต่อ";
        });

        window.addEventListener('storage', (event) => {
            if (event.key === 'adminCommand') {
                try {
                    const command = JSON.parse(event.newValue);
                    processAdminCommand(command);
                } catch(e) {}
            }
        });

        // ดึงข้อมูลชื่อและรหัสผ่านจาก Google Sheet เมื่อเปิดหน้าเว็บ
        fetchJudgeCredentials();

        // ตรวจสอบการล็อกอินที่มีอยู่
        checkExistingLogin();
    </script>
</body>
</html>
