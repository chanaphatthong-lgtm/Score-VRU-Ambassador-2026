<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Judge Screen - VRU Ambassador 2025</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- โหลดฟอนต์ Inter และ Kanit จาก Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Kanit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- MQTT SDK รับสัญญาณข้ามเครื่องผ่าน WebSocket -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    
    <style>
        @font-face {
            font-family: 'Inter-Latin';
            src: local('Inter');
            unicode-range: U+0041-005A, U+0061-007A;
        }

        /* 🔒 ล็อกหน้าจอถาวร ป้องกันการเลื่อน/เด้ง/ซูม บน iPad ทุกกรณี */
        * {
            touch-action: manipulation;
        }
        
        html, body {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw;
            height: 100vh;
            touch-action: none !important;
            -webkit-user-select: none;
            user-select: none;
            overscroll-behavior: none;
            overflow: hidden !important;
        }

        /* ตั้งค่าเริ่มต้นโหมดสว่าง */
        html, body {
            font-family: 'Inter-Latin', 'Kanit', sans-serif;
            background: linear-gradient(135deg, #f0f7ff 0%, #d9ecff 100%);
            background-color: #f0f7ff;
            transition: background 0.4s ease, background-color 0.4s ease, color 0.4s ease;
        }

        input, select {
            -webkit-user-select: auto !important;
            user-select: auto !important;
            font-family: 'Inter-Latin', 'Kanit', sans-serif;
            touch-action: auto !important;
        }

        /* --- Custom SVG Padlock Animation --- */
        .padlock {
            width: 38px;
            height: 44px;
            overflow: visible;
        }

        .padlock .body {
            fill: #ffffff;
            stroke: #2563eb; 
            stroke-width: 6;
            stroke-linejoin: round;
            transition: stroke 0.4s ease, fill 0.4s ease;
        }

        .padlock .shackle,
        .padlock .keyhole {
            fill: none;
            stroke: #2563eb; 
            stroke-width: 6;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.4s ease, transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* เมื่อปลดล็อก -> เลื่อนขึ้น และเปลี่ยนเป็นสีเขียว */
        .is-unlocked .padlock .body,
        .is-unlocked .padlock .shackle,
        .is-unlocked .padlock .keyhole {
            stroke: #16a34a !important; 
        }

        .is-unlocked .padlock .shackle {
            transform: translateY(-12px); 
        }

        /* Glassmorphism Styles */
        .liquid-glass {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
            transition: all 0.4s ease;
        }
        
        /* -----------------------------------------------------
           แอนิเมชันเปิด/ปิด ฉากล็อกหน้าจอ (สมูทขึ้น/ลง)
           ----------------------------------------------------- */
        .modal-glass {
            background: rgba(255, 255, 255, 0.88); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 15px 40px 0 rgba(31, 38, 135, 0.15);
            /* แอนิเมชันตอนเลื่อนกล่อง */
            transition: transform 0.9s cubic-bezier(0.68, -0.1, 0.265, 1.15), opacity 0.8s ease;
        }

        #waiting-overlay {
            /* แอนิเมชันการเบลอและจางหายของฉากหลัง */
            transition: opacity 0.9s ease, backdrop-filter 0.9s ease, -webkit-backdrop-filter 0.9s ease;
        }

        .login-card-theme {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.2);
        }
        .login-card-theme .login-title { color: #1e3a8a; }
        .login-card-theme .login-subtitle { color: #64748b; }
        .login-card-theme .login-label { color: #1e3a8a; }
        .login-card-theme .login-input {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #bfdbfe;
            color: #1e293b;
        }
        .login-card-theme .login-input:focus { border-color: #2563eb; }
        .login-card-theme .login-btn {
            background: #1e3a8a;
            color: #ffffff;
        }
        .login-card-theme .login-btn:hover { background: #1d4ed8; }

        .glass-button:active {
            transform: scale(0.97);
        }
        
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        .animate-wipe-diagonal {
            animation: wipeDiagonalReveal 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        
        @keyframes wipeDiagonalReveal {
            0% {
                clip-path: polygon(0 0, -20% 0, -50% 100%, 0 100%);
                transform: translateX(-30px); 
                opacity: 0;
            }
            100% {
                clip-path: polygon(0 0, 150% 0, 120% 100%, 0 100%);
                transform: translateX(0); 
                opacity: 1;
            }
        }

        /* DARK MODE STYLES แก้ไขบังคับคลุมทั้งจอ iPad */
        html.dark-mode, body.dark-mode {
            background: linear-gradient(135deg, #0b0f19 0%, #111827 100%) !important;
            background-color: #0b0f19 !important; /* ยืนยันสีพื้นหลังดำสนิท */
            color: #f1f5f9;
        }
        body.dark-mode .padlock .body {
            fill: #1f2937; 
            stroke: #60a5fa; 
        }
        body.dark-mode .padlock .shackle,
        body.dark-mode .padlock .keyhole {
            stroke: #60a5fa; 
        }
        body.dark-mode .is-unlocked .padlock .body,
        body.dark-mode .is-unlocked .padlock .shackle,
        body.dark-mode .is-unlocked .padlock .keyhole {
            stroke: #4ade80 !important; 
        }
        body.dark-mode .liquid-glass {
            background: rgba(17, 24, 39, 0.65);
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
        body.dark-mode .modal-glass {
            background: rgba(17, 24, 39, 0.92);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 15px 40px 0 rgba(0, 0, 0, 0.7);
        }
        body.dark-mode .login-card-theme {
            background: rgba(15, 23, 42, 0.94);
            border-color: rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.7);
        }
        body.dark-mode .login-card-theme .login-title { color: #93c5fd; }
        body.dark-mode .login-card-theme .login-subtitle { color: #94a3b8; }
        body.dark-mode .login-card-theme .login-label { color: #93c5fd; }
        body.dark-mode .login-card-theme .login-input {
            background: rgba(30, 41, 59, 0.9);
            border: 2px solid #334155;
            color: #f8fafc;
        }
        body.dark-mode .login-card-theme .login-input:focus { border-color: #3b82f6; }
        body.dark-mode .login-card-theme .login-btn {
            background: #2563eb;
            color: #ffffff;
        }
        body.dark-mode .login-card-theme .login-btn:hover { background: #1d4ed8; }
        body.dark-mode .header-bg-box {
            background: rgba(31, 41, 55, 0.7) !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
            color: #f3f4f6 !important;
        }
        body.dark-mode .criterion-card {
            background: rgba(31, 41, 55, 0.5) !important;
            border-color: rgba(255, 255, 255, 0.08) !important;
        }
        body.dark-mode .criterion-name {
            color: #f3f4f6 !important;
        }
        body.dark-mode .score-input {
            background: rgba(17, 24, 39, 0.9) !important;
            border-color: #3b82f6 !important;
            color: #60a5fa !important;
        }
        body.dark-mode h1, body.dark-mode h3, body.dark-mode #device-id-text, body.dark-mode #display-judge-name {
            color: #93c5fd !important;
        }
        body.dark-mode h2 { color: #cbd5e1 !important; }
        body.dark-mode #waiting-title { color: #93c5fd !important; }
        body.dark-mode #waiting-text { color: #9ca3af !important; }
        body.dark-mode #icon-container {
            background: #1f2937 !important;
        }
        body.dark-mode #display-nickname {
            background: rgba(31, 41, 55, 0.9) !important;
            border-color: #3b82f6 !important;
            color: #93c5fd !important;
        }
        body.dark-mode #display-round {
            background: rgba(30, 58, 138, 0.5) !important;
            color: #bfdbfe !important;
            border-color: rgba(96, 165, 250, 0.3) !important;
        }
    </style>
</head>
<body class="text-slate-800 p-6 flex flex-col h-screen overflow-hidden select-none">

    <!-- OVERLAY 1: หน้าจอล็อกอินเข้าใช้งานเครื่องกรรมการ -->
    <div id="login-overlay" class="fixed inset-0 bg-slate-950/75 backdrop-blur-2xl z-[100] flex items-center justify-center p-4 transition-all duration-500">
        <div class="login-card-theme w-full max-w-[480px] p-6 md:p-8 rounded-[2rem] shadow-2xl text-center flex flex-col items-center my-auto">
            <div class="w-28 h-28 mb-2 flex items-center justify-center shrink-0">
                <img id="event-logo" src="logo.png" alt="Logo" class="w-full h-full object-contain filter drop-shadow-md" onError="this.onerror=null; this.src='https://img.icons8.com/color/144/scales.png';">
            </div>
            <h2 class="login-title text-2xl font-black mb-1 leading-tight">เข้าสู่ระบบกรรมการ</h2>
            <p class="login-subtitle text-xs font-semibold mb-5">เลือกหมายเลขเครื่อง iPad และกรอกรหัสผ่านเพื่อเข้าใช้งาน</p>
            <form id="login-form" class="w-full space-y-3 text-left">
                <div>
                    <label class="login-label block text-xs font-bold mb-1">หมายเลขเครื่องกรรมการ</label>
                    <select id="login-device-select" class="login-input w-full h-11 rounded-xl px-4 text-sm font-bold outline-none transition-all shadow-inner">
                        <option value="iPad 01">iPad 01</option>
                        <option value="iPad 02">iPad 02</option>
                        <option value="iPad 03">iPad 03</option>
                        <option value="iPad 04">iPad 04</option>
                        <option value="iPad 05">iPad 05</option>
                    </select>
                </div>
                <div>
                    <label class="login-label block text-xs font-bold mb-1">ชื่อ-นามสกุล กรรมการ</label>
                    <select id="login-judge-select" required class="login-input w-full h-11 rounded-xl px-4 text-sm font-bold outline-none transition-all shadow-inner">
                        <option value="">กำลังโหลดชื่อกรรมการ...</option>
                    </select>
                </div>
                <div>
                    <label class="login-label block text-xs font-bold mb-1">รหัสผ่าน</label>
                    <input type="password" id="login-password" required placeholder="กรอกรหัสผ่าน..." class="login-input w-full h-11 rounded-xl px-4 text-sm font-bold outline-none transition-all shadow-inner">
                </div>
                <div id="login-error-msg" class="text-xs font-bold text-rose-500 text-center hidden py-0.5">
                    ⚠️ รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง
                </div>
                <button type="submit" class="login-btn glass-button w-full h-12 font-bold text-base rounded-xl shadow-lg transition-all active:scale-95 mt-2 flex items-center justify-center gap-2">
                    <span>เข้าสู่ระบบประเมิน</span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </form>
        </div>
    </div>

    <!-- OVERLAY 2: หน้าจอล็อกรอแอดมิน (เพิ่มแอนิเมชันเลื่อนขึ้น-ลงและจางหาย) -->
    <div id="waiting-overlay" class="fixed inset-0 bg-slate-950/60 backdrop-blur-xl z-50 flex items-center justify-center">
        <div id="waiting-modal" class="modal-glass w-[460px] h-[320px] rounded-3xl flex flex-col items-center justify-center text-center transform translate-y-0 opacity-100 px-8">
            <div id="icon-container" class="w-20 h-20 bg-white shadow-md rounded-full flex items-center justify-center mb-6 transition-transform duration-300 shrink-0">
                <svg class="padlock" viewBox="0 0 60 70" xmlns="http://www.w3.org/2000/svg">
                    <path class="shackle" d="M 18 50 V 24 A 12 12 0 0 1 42 24 V 36" />
                    <rect class="body" x="6" y="36" width="48" height="30" rx="6" />
                    <path class="keyhole" d="M 30 46 V 54" />
                </svg>
            </div>
            <div class="h-[80px] flex flex-col items-center justify-start">
                <h3 id="waiting-title" class="text-3xl font-bold text-blue-900 mb-2 transition-colors duration-300 w-full">กรุณารอสักครู่</h3>
                <p id="waiting-text" class="text-slate-600 font-medium w-full">รอผู้ควบคุมเปิดระบบรับคะแนน...</p>
            </div>
        </div>
    </div>

    <!-- HEADER -->
    <nav class="relative z-[60] liquid-glass rounded-3xl p-5 mb-5 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-5">
            <div id="profile-group" class="flex flex-col items-center shrink-0">
                <div id="profile-circle" class="relative overflow-hidden w-16 h-16 rounded-full bg-blue-900 text-white flex items-center justify-center font-bold text-3xl shadow-lg shrink-0">
                    ?
                </div>
                <div id="display-nickname-wrapper" class="mt-1 flex justify-center">
                    <span id="display-nickname" class="text-xs font-bold text-blue-900 bg-white/80 px-2.5 py-0.5 rounded-full border border-blue-200 shadow-sm inline-block max-w-[90px] truncate text-center">
                        -
                    </span>
                </div>
            </div>

            <div class="flex flex-col justify-center">
                <div id="display-round-wrapper" class="mb-1">
                    <div id="display-round" class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-xs font-bold inline-block border border-blue-200">
                        รอเลือกการแข่งขัน
                    </div>
                </div>
                <div id="contestant-details-wrapper" class="flex items-baseline gap-3">
                    <h1 id="display-number" class="text-3xl font-black text-blue-900">-</h1>
                    <h2 id="display-name" class="text-xl font-bold text-slate-600">-</h2>
                </div>
            </div>
        </div>
        
        <div class="flex items-center gap-3">
            <button id="theme-toggle-btn" class="header-bg-box bg-white/70 hover:bg-white/90 px-4 h-12 rounded-2xl border border-white shadow-sm flex items-center justify-center transition-all cursor-pointer">
                <span id="theme-icon-moon" class="text-lg">🌙</span>
                <span id="theme-icon-sun" class="text-lg hidden">☀️</span>
            </button>

            <div class="header-bg-box bg-white/70 px-4 h-12 rounded-2xl border border-white shadow-sm flex items-center gap-2.5">
                <div id="conn-dot" class="w-3 h-3 rounded-full bg-yellow-500 animate-pulse"></div>
                <div id="conn-text" class="text-xs font-bold text-yellow-600 uppercase tracking-wide">กำลังเชื่อมต่อ</div>
                <div class="h-4 w-[1px] bg-slate-300 mx-0.5"></div>
                <div id="device-id-text" class="text-base font-black text-blue-900">iPad 01</div>
            </div>
            
            <div class="header-bg-box bg-white/70 px-6 h-12 rounded-2xl border border-white shadow-sm flex items-center justify-center gap-3">
                <div id="display-judge-name" class="text-lg font-black text-blue-900">-</div>
                <button id="logout-btn" title="ออกจากระบบ / สลับเครื่อง" class="text-xs bg-rose-500/10 hover:bg-rose-500/20 text-rose-600 font-bold px-2.5 py-1 rounded-xl transition-all border border-rose-200/50 active:scale-95">
                    🚪 สลับเครื่อง
                </button>
            </div>
        </div>
    </nav>

    <!-- MAIN SCORING PANEL -->
    <main class="relative z-40 liquid-glass rounded-3xl p-6 flex-1 flex flex-col min-h-0">
        <div class="flex justify-between items-center mb-4 shrink-0 gap-4">
            <h3 class="text-lg font-bold text-blue-900 flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                แบบประเมินให้คะแนน
            </h3>
            <button id="submit-btn" class="glass-button bg-blue-900 hover:bg-blue-800 text-white font-bold text-lg px-7 py-3 rounded-2xl shadow-md transition-all flex items-center gap-2 shrink-0">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                บันทึกคะแนนและส่ง
            </button>
        </div>
        <div id="criteria-container" class="grid grid-cols-1 md:grid-cols-2 gap-4 flex-1 pb-28 content-start">
        </div>
    </main>

    <!-- Script -->
    <script>
        // 🔒 บังคับล็อก Touch Event
        document.addEventListener('touchmove', function(e) {
            if (!e.target.closest('#criteria-container')) {
                e.preventDefault();
            }
        }, { passive: false });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, { passive: false });
        
        document.addEventListener('gesturestart', (e) => e.preventDefault());

        const PASSWORD_SHEET_ID = '1wXJcgOcb7-AB3LyzH-NejVgNLQ8JxCbEJ_vHta780r0';
        const PASSWORD_SHEET_NAME = 'รหัสคณะกรรมการ';

        const JUDGE_CONFIGS = {
            'iPad 01': { sheetId: '1mQ0ZMdVzkJe6Jgma9m9rn-tZ-otMVQf4ame_5i_3rR8', scriptUrl: 'https://script.google.com/macros/s/AKfycbzQzsoTBE0rxF9wzFs8DJtlqUFqub80gLXb83lJ5xNVphXlGpQwttm4IkJtOAZ6HF_Lyg/exec' },
            'iPad 02': { sheetId: '1ChJNDGBQ3E1yMImjU30RjVjShPtiXX3psMb2NQhc14Q', scriptUrl: 'https://script.google.com/macros/s/AKfycbwAbpOVoYI6hrhDE0ADXOW06EKrXhHc2DPysWaugQazSy_3NohiTRoX2H5FI4msiZG2/exec' },
            'iPad 03': { sheetId: '1qX5Re7Prh7R_Gx4lyflCKPpJ6jTadveKWhxCmDBXz_Q', scriptUrl: 'https://script.google.com/macros/s/AKfycbwCTpDygraH7getS4rmxbdlFL7YNcSRln-XMWeH_wqGBn9fsXkcQTbDR831kJfE9SY9Xg/exec' },
            'iPad 04': { sheetId: 'วาง_SHEET_ID_กรรมการ_4_ตรงนี้', scriptUrl: '' },
            'iPad 05': { sheetId: 'วาง_SHEET_ID_กรรมการ_5_ตรงนี้', scriptUrl: '' }
        };

        const deviceIdText = document.getElementById('device-id-text');
        
        function getCurrentConfig() {
            const currentDev = deviceIdText ? deviceIdText.textContent.trim() : 'iPad 01';
            return JUDGE_CONFIGS[currentDev] || JUDGE_CONFIGS['iPad 01'];
        }

        let fetchedJudgesList = []; 

        async function fetchJudgeCredentials() {
            try {
                const gvizUrl = `https://docs.google.com/spreadsheets/d/${PASSWORD_SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(PASSWORD_SHEET_NAME)}`;
                const response = await fetch(gvizUrl);
                const text = await response.text();
                
                const jsonString = text.substring(47, text.length - 2);
                const data = JSON.parse(jsonString);

                fetchedJudgesList = [];
                if (data.table && data.table.rows) {
                    data.table.rows.forEach(row => {
                        if (row.c && row.c[0] && row.c[0].v) {
                            const dev = String(row.c[0].v || '').trim();
                            const rawName = String(row.c[1] ? (row.c[1].v || '') : '').trim();
                            const pwd = String(row.c[2] ? (row.c[2].v || '') : '').trim();
                            const cleanName = rawName.replace(/\s*\([^)]*\)/g, '').trim();

                            if (dev && !dev.includes('อุปกรณ์')) {
                                fetchedJudgesList.push({ device: dev, name: cleanName, password: pwd });
                            }
                        }
                    });
                }
                renderJudgeSelectOptions();
            } catch (err) {}
        }

        function renderJudgeSelectOptions() {
            const loginJudgeSelect = document.getElementById('login-judge-select');
            const selectedDev = document.getElementById('login-device-select').value;
            if (fetchedJudgesList.length === 0) {
                loginJudgeSelect.innerHTML = `<option value="">ไม่พบรายชื่อกรรมการในชีท</option>`;
                return;
            }
            loginJudgeSelect.innerHTML = '';
            let matchedJudgeName = '';
            fetchedJudgesList.forEach(item => {
                const isMatchDev = item.device.toLowerCase().replace(/\s+/g, '') === selectedDev.toLowerCase().replace(/\s+/g, '');
                if (isMatchDev && !matchedJudgeName) matchedJudgeName = item.name;
                const opt = document.createElement('option');
                opt.value = item.name;
                opt.textContent = item.name;
                loginJudgeSelect.appendChild(opt);
            });
            if (matchedJudgeName) loginJudgeSelect.value = matchedJudgeName;
        }

        const themeToggleBtn = document.getElementById('theme-toggle-btn');
        const themeIconMoon = document.getElementById('theme-icon-moon');
        const themeIconSun = document.getElementById('theme-icon-sun');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)');

        function applyTheme(isDark) {
            if (isDark) {
                document.documentElement.classList.add('dark-mode');
                document.body.classList.add('dark-mode');
                themeIconMoon.classList.add('hidden');
                themeIconSun.classList.remove('hidden');
            } else {
                document.documentElement.classList.remove('dark-mode');
                document.body.classList.remove('dark-mode');
                themeIconMoon.classList.remove('hidden');
                themeIconSun.classList.add('hidden');
            }
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('ipad_theme');
            if (savedTheme === 'dark') applyTheme(true);
            else if (savedTheme === 'light') applyTheme(false);
            else applyTheme(systemPrefersDark.matches);
        }

        themeToggleBtn.addEventListener('click', () => {
            const newIsDark = !document.body.classList.contains('dark-mode');
            applyTheme(newIsDark);
            localStorage.setItem('ipad_theme', newIsDark ? 'dark' : 'light');
        });
        initTheme();

        const loginOverlay = document.getElementById('login-overlay');
        const loginForm = document.getElementById('login-form');
        const loginDeviceSelect = document.getElementById('login-device-select');
        const loginJudgeSelect = document.getElementById('login-judge-select');
        const loginPasswordInput = document.getElementById('login-password');
        const loginErrorMsg = document.getElementById('login-error-msg');
        const logoutBtn = document.getElementById('logout-btn');

        loginDeviceSelect.addEventListener('change', () => {
            loginErrorMsg.classList.add('hidden');
            renderJudgeSelectOptions();
        });

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const devId = loginDeviceSelect.value;
            const selectedJudgeName = loginJudgeSelect.value;
            const inputPwd = loginPasswordInput.value.trim();

            loginErrorMsg.classList.add('hidden');
            const targetJudge = fetchedJudgesList.find(j => j.name === selectedJudgeName);
            if (targetJudge && targetJudge.password && inputPwd !== targetJudge.password) {
                loginErrorMsg.textContent = '⚠️ รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง';
                loginErrorMsg.classList.remove('hidden');
                return;
            }

            localStorage.setItem('logged_judge_device', devId);
            localStorage.setItem('logged_judge_name', selectedJudgeName);
            applyLoggedInUser(devId, selectedJudgeName);

            loginOverlay.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => { loginOverlay.classList.add('hidden'); }, 500);
        });

        function applyLoggedInUser(devId, jName) {
            deviceIdText.textContent = devId;
            displayJudgeName.textContent = jName;
            sendHeartbeat();
            loadCriteriaForRound('รอบที่ 1');
        }

        function checkExistingLogin() {
            const savedDev = localStorage.getItem('logged_judge_device');
            const savedName = localStorage.getItem('logged_judge_name');
            if (savedDev && savedName && JUDGE_CONFIGS[savedDev]) {
                loginDeviceSelect.value = savedDev;
                applyLoggedInUser(savedDev, savedName);
                loginOverlay.classList.add('hidden');
            }
        }

        logoutBtn.addEventListener('click', () => {
            if (confirm('คุณต้องการออกจากระบบเพื่อสลับเครื่องหรือสลับชื่อกรรมการใช่หรือไม่?')) {
                localStorage.removeItem('logged_judge_device');
                localStorage.removeItem('logged_judge_name');
                loginPasswordInput.value = '';
                loginErrorMsg.classList.add('hidden');
                loginOverlay.classList.remove('hidden', 'opacity-0', 'pointer-events-none');
            }
        });

        const overlay = document.getElementById('waiting-overlay');
        const waitingModal = document.getElementById('waiting-modal');
        const waitingTitle = document.getElementById('waiting-title');
        const waitingText = document.getElementById('waiting-text');
        const submitBtn = document.getElementById('submit-btn');
        const iconContainer = document.getElementById('icon-container');
        
        const displayRoundNode = document.getElementById('display-round');
        const displayRoundWrapper = document.getElementById('display-round-wrapper');
        const profileCircle = document.getElementById('profile-circle');
        const displayNicknameNode = document.getElementById('display-nickname');
        const displayNicknameWrapper = document.getElementById('display-nickname-wrapper');
        const contestantDetailsWrapper = document.getElementById('contestant-details-wrapper');
        const criteriaContainer = document.getElementById('criteria-container');
        const connDot = document.getElementById('conn-dot');
        const connText = document.getElementById('conn-text');
        const displayJudgeName = document.getElementById('display-judge-name');

        let currentContestantCode = '';

        const ROUND_CONFIGS = {
            'รอบที่ 1': { sheet: 'รอบที่ 1', ranges: ['D11:F11', 'G10:I10'] },
            'รอบที่ 2': { sheet: 'รอบที่ 2', ranges: ['D10:G10'] },
            'รอบที่ 3': { sheet: 'รอบที่ 3', ranges: ['D10', 'E11:G11', 'H10'] },
            'รอบที่ 4': { sheet: 'รอบที่ 4', ranges: ['D11:H11', 'I10'] },
            'รอบที่ 5': { sheet: 'รอบที่ 5', ranges: ['D11:H11', 'I10'] }
        };

        async function fetchSingleRange(sheetName, range) {
            try {
                const config = getCurrentConfig();
                if (!config.sheetId || config.sheetId.includes('วาง_SHEET_ID')) return [];
                const url = `https://docs.google.com/spreadsheets/d/${config.sheetId}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}&range=${encodeURIComponent(range)}`;
                const response = await fetch(url);
                const text = await response.text();
                const jsonString = text.substring(47, text.length - 2);
                const data = JSON.parse(jsonString);
                let results = [];
                if (data.table && data.table.rows && data.table.rows.length > 0) {
                    const cells = data.table.rows[0].c;
                    cells.forEach(cell => {
                        if (cell) {
                            const val = cell.f || cell.v || '';
                            if (val !== '') results.push(String(val));
                        }
                    });
                }
                return results;
            } catch (err) { return []; }
        }

        async function loadCriteriaForRound(roundName) {
            let matchedKey = Object.keys(ROUND_CONFIGS).find(key => roundName.includes(key)) || 'รอบที่ 1';
            const config = ROUND_CONFIGS[matchedKey];
            let allCriteria = [];
            for (const range of config.ranges) {
                const rangeItems = await fetchSingleRange(config.sheet, range);
                allCriteria = allCriteria.concat(rangeItems);
            }
            if (allCriteria.length > 0) renderCriteria(allCriteria);
        }

        function renderCriteria(criteriaList) {
            criteriaContainer.innerHTML = '';
            criteriaList.forEach((criterionName) => {
                const matchScore = criterionName.match(/\((\d+)\s*คะแนน\)/) || criterionName.match(/\((\d+)\)/);
                const maxScore = matchScore ? parseFloat(matchScore[1]) : 10;
                const cardHTML = `
                    <div class="criterion-card bg-white/70 border border-white p-4 rounded-2xl shadow-sm flex justify-between items-center hover:shadow-md transition-shadow gap-3">
                        <div class="flex-1 flex flex-col justify-center">
                            <h4 class="criterion-name text-lg font-bold text-slate-800 leading-tight">${criterionName}</h4>
                        </div>
                        <div class="w-32 shrink-0 flex flex-col items-center justify-center">
                            <input type="number" inputmode="decimal" step="any" min="0" max="${maxScore}" placeholder="0" class="score-input w-full h-full min-h-[5rem] text-center text-5xl font-black text-blue-900 bg-white border-2 border-blue-200 rounded-2xl focus:border-blue-500 focus:ring-4 focus:ring-blue-100 outline-none transition-all shadow-inner">
                        </div>
                    </div>
                `;
                criteriaContainer.insertAdjacentHTML('beforeend', cardHTML);
            });
            setupScoreValidation();
        }

        function setupScoreValidation() {
            const scoreInputs = document.querySelectorAll('.score-input');
            scoreInputs.forEach(input => {
                input.addEventListener('input', function() {
                    if (this.value === '') return;
                    let val = parseFloat(this.value);
                    let maxScore = parseFloat(this.getAttribute('max')) || 10; 
                    if (isNaN(val)) return;
                    if (val > maxScore) this.value = maxScore;
                    else if (val < 0) this.value = 0;
                });
                input.addEventListener('blur', function() {
                    if (this.value === '') return;
                    let val = parseFloat(this.value);
                    let maxScore = parseFloat(this.getAttribute('max')) || 10;
                    if (isNaN(val) || val < 0) this.value = 0;
                    else if (val > maxScore) this.value = maxScore;
                });
            });
        }

        // =========================================================
        // แอนิเมชันย้อนกลับ (ล็อกหน้าจอเมื่อบันทึกคะแนน)
        // =========================================================
        submitBtn.addEventListener('click', async () => {
            const currentDev = deviceIdText.textContent.trim() || 'iPad 01';
            const config = JUDGE_CONFIGS[currentDev] || JUDGE_CONFIGS['iPad 01'];

            // 1. นำฉากหลังขึ้นมาก่อน (โปร่งใส)
            overlay.style.display = 'flex';
            overlay.classList.remove('hidden');
            
            // 2. เซ็ตตำแหน่งกล่องให้อยู่ด้านบน (-120vh) แล้วค่อยๆ เลื่อนลงมา
            waitingModal.style.transition = 'none'; // ปิด transition ชั่วคราวเพื่อตั้งค่าเริ่มต้น
            waitingModal.style.transform = 'translateY(-120vh)';
            waitingModal.style.opacity = '0';
            
            // เปลี่ยนข้อความกุญแจเป็นสถานะล็อก
            iconContainer.classList.remove('is-unlocked', 'scale-110');
            waitingTitle.classList.remove('text-green-600');
            waitingTitle.textContent = "กำลังบันทึกคะแนน...";
            waitingText.textContent = `กำลังบันทึกเข้าชีท ${currentDev}...`;
            
            // 3. เริ่มแอนิเมชันเลื่อนลง และค่อยๆ เบลอฉากหลัง
            setTimeout(() => {
                waitingModal.style.transition = 'transform 0.9s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.8s ease';
                waitingModal.style.transform = 'translateY(0)';
                waitingModal.style.opacity = '1';
                
                overlay.classList.remove('opacity-0');
                overlay.style.backdropFilter = 'blur(20px)';
                overlay.style.webkitBackdropFilter = 'blur(20px)';
            }, 50);

            const scoreInputs = document.querySelectorAll('.score-input');
            const scoresList = [];
            scoreInputs.forEach(input => {
                const val = parseFloat(input.value);
                scoresList.push(isNaN(val) ? 0 : val);
            });

            const currentRound = displayRoundNode.textContent.trim();
            const payload = {
                judgeId: currentDev,
                judgeName: displayJudgeName ? displayJudgeName.textContent.trim() : '',
                sheetId: config.sheetId,
                roundName: currentRound,
                contestantCode: currentContestantCode,
                scores: scoresList
            };

            try {
                if (config.scriptUrl && config.scriptUrl.startsWith('http')) {
                    await fetch(config.scriptUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                }
                setTimeout(() => {
                    waitingTitle.textContent = "ส่งคะแนนเรียบร้อย!";
                    waitingText.textContent = "กำลังรอผู้ควบคุมเปิดระบบสำหรับคนถัดไป...";
                }, 800); // รอให้กล่องลงมาเสร็จก่อนค่อยเปลี่ยนข้อความ
            } catch (err) {
                setTimeout(() => {
                    waitingTitle.textContent = "บันทึกเรียบร้อย";
                    waitingText.textContent = "กำลังรอผู้ควบคุมเปิดระบบสำหรับคนถัดไป...";
                }, 800);
            }
        });

        const pageLoadTime = Date.now();
        let lastProcessedTime = pageLoadTime;

        async function processAdminCommand(command) {
            if (!command || !command.timestamp || command.timestamp <= lastProcessedTime) return;
            lastProcessedTime = command.timestamp;

            if (command.action === 'START_VOTING') {
                currentContestantCode = command.contestantCode || '';
                const nameParts = (command.contestantName || '').split(' - ');
                const numberStr = nameParts[0] || '-'; 
                let nameStr = nameParts[1] || ''; 
                const justNumber = numberStr.replace(/\D/g, ''); 

                let nicknameStr = command.contestantNickname || command.nickname || '';
                const matchParen = nameStr.match(/\(([^)]+)\)/);
                if (matchParen) {
                    nicknameStr = matchParen[1];
                    nameStr = nameStr.replace(/\s*\([^)]+\)/, '').trim();
                }
                
                const currentRoundText = displayRoundNode.textContent.trim();
                const newRoundText = command.roundName || 'รอบที่ 1';
                const isRoundChanged = currentRoundText !== newRoundText;

                // 1. ทำให้กุญแจกลายเป็นสีเขียว (ปลดล็อก)
                iconContainer.classList.add('is-unlocked', 'scale-110');
                waitingTitle.classList.add('text-green-600');
                waitingTitle.textContent = "ปลดล็อกแล้ว";
                waitingText.textContent = "เชิญเริ่มการให้คะแนนได้";
                
                document.querySelectorAll('.score-input').forEach(input => input.value = '');

                try {
                    if (isRoundChanged) displayRoundNode.textContent = newRoundText;
                    document.getElementById('display-number').textContent = numberStr;
                    document.getElementById('display-name').textContent = nameStr;
                    displayNicknameNode.textContent = nicknameStr ? nicknameStr : '-';
                    
                    const imageUrl = command.contestantImage || command.imageUrl;
                    if (imageUrl) {
                        profileCircle.innerHTML = `<img src="${imageUrl}" class="w-full h-full object-cover rounded-full" alt="${justNumber}">`;
                    } else {
                        profileCircle.textContent = justNumber || '?';
                    }
                    
                    let elementsToAnimate = [profileCircle, displayNicknameWrapper, contestantDetailsWrapper];
                    if (isRoundChanged) elementsToAnimate.push(displayRoundWrapper);
                    elementsToAnimate.forEach(el => {
                        if (el) {
                            el.classList.remove('animate-wipe-diagonal');
                            void el.offsetWidth; 
                            el.classList.add('animate-wipe-diagonal');
                        }
                    });

                    loadCriteriaForRound(newRoundText).catch(e => console.error(e));

                } catch(e) {}

                // 2. แอนิเมชันเปิดจอ: รอโชว์กุญแจเขียวสักพัก แล้วให้กล่องเลื่อนขึ้นพ้นจอพร้อมฉากหลังหายเบลอ
                setTimeout(() => {
                    
                    // ปรับกลับมาใช้ transition สำหรับเลื่อนขึ้น
                    waitingModal.style.transition = 'transform 0.9s cubic-bezier(0.68, -0.1, 0.265, 1.15), opacity 0.8s ease';
                    waitingModal.style.transform = 'translateY(-120vh)';
                    waitingModal.style.opacity = '0';
                    
                    // ให้ overlay คลายความเบลอและจางหาย
                    overlay.classList.add('opacity-0');
                    overlay.style.backdropFilter = 'blur(0px)';
                    overlay.style.webkitBackdropFilter = 'blur(0px)';
                    
                    // รอจนแอนิเมชันจบแล้วค่อยซ่อน element จริงๆ
                    setTimeout(() => {
                        overlay.style.display = 'none';
                        overlay.classList.add('hidden');
                        
                        // รีเซ็ตค่าสไตล์กลับมาเผื่อหน้าจอโดนล็อกอีกรอบ (แต่ซ่อนไว้ก่อน)
                        waitingModal.style.transition = 'none'; // ปิดแอนิเมชันตอนรีเซ็ต
                        waitingModal.style.transform = 'translateY(-120vh)';
                        
                        iconContainer.classList.remove('is-unlocked', 'scale-110');
                        waitingTitle.classList.remove('text-green-600');
                        
                        waitingTitle.textContent = "กรุณารอสักครู่";
                        waitingText.textContent = "รอผู้ควบคุมเปิดระบบรับคะแนน...";
                    }, 800); 
                    
                }, 1200);
            } 
            else if (command.action === 'LOCK_SCREEN') {
                // ถ้าแอดมินสั่งล็อก ให้สไลด์ลงมาเหมือนตอนกดบันทึกคะแนน
                overlay.style.display = 'flex';
                overlay.classList.remove('hidden');
                
                waitingModal.style.transition = 'none';
                waitingModal.style.transform = 'translateY(-120vh)';
                waitingModal.style.opacity = '0';
                
                iconContainer.classList.remove('is-unlocked', 'scale-110');
                waitingTitle.classList.remove('text-green-600');
                
                waitingTitle.textContent = "ล็อกหน้าจอแล้ว";
                waitingText.textContent = "ผู้ควบคุมสั่งล็อกหน้าจอรับคะแนน...";

                setTimeout(() => {
                    waitingModal.style.transition = 'transform 0.9s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.8s ease';
                    waitingModal.style.transform = 'translateY(0)';
                    waitingModal.style.opacity = '1';
                    
                    overlay.classList.remove('opacity-0');
                    overlay.style.backdropFilter = 'blur(20px)';
                    overlay.style.webkitBackdropFilter = 'blur(20px)';
                }, 50);
            }
        }

        const CMD_TOPIC = 'vru_pageant_2025/admin_cmd';
        const STATUS_TOPIC = 'vru_pageant_2025/device_status';
        const mqttClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');

        mqttClient.on('connect', () => {
            connDot.className = "w-3 h-3 rounded-full bg-green-500 animate-pulse shadow-[0_0_8px_rgba(34,197,94,0.8)]";
            connText.className = "text-xs font-bold text-green-600 uppercase tracking-wide";
            connText.textContent = "เชื่อมต่อแล้ว";
            mqttClient.subscribe(CMD_TOPIC, { qos: 1 });
            sendHeartbeat();
            setInterval(sendHeartbeat, 3000);
        });

        function sendHeartbeat() {
            if (mqttClient && mqttClient.connected) {
                const currentDev = deviceIdText ? deviceIdText.textContent.trim() : 'iPad 01';
                const statusPayload = {
                    deviceId: currentDev,
                    judgeName: displayJudgeName ? displayJudgeName.textContent.trim() : '',
                    timestamp: Date.now()
                };
                mqttClient.publish(STATUS_TOPIC, JSON.stringify(statusPayload), { qos: 0 });
            }
        }

        mqttClient.on('message', (topic, message) => {
            if (topic === CMD_TOPIC) {
                try {
                    const command = JSON.parse(message.toString());
                    processAdminCommand(command);
                } catch (err) {}
            }
        });

        mqttClient.on('error', (err) => {
            connDot.className = "w-3 h-3 rounded-full bg-red-500 animate-pulse";
            connText.className = "text-xs font-bold text-red-600 uppercase tracking-wide";
            connText.textContent = "ขาดการเชื่อมต่อ";
        });

        window.addEventListener('storage', (event) => {
            if (event.key === 'adminCommand') {
                try {
                    const command = JSON.parse(event.newValue);
                    processAdminCommand(command);
                } catch(e) {}
            }
        });

        fetchJudgeCredentials();
        checkExistingLogin();
    </script>
</body>
</html>
