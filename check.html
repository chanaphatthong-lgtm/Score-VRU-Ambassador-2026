<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- 📱 Meta Tag สำหรับซิงก์สีขอบบน-ล่างของ Safari บน iPhone / iOS ให้เต็มจอ -->
    <meta name="theme-color" id="theme-color-meta" content="#e0eaf5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" id="status-bar-style" content="default">
    
    <title>เช็คชื่อรอบเก็บตัว - VRU Ambassador 2026</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <!-- ฟอนต์ Kanit และ Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=Kanit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        @font-face {
            font-family: 'Inter-Latin';
            src: local('Inter');
            unicode-range: U+0041-005A, U+0061-007A, U+0030-0039;
        }

        html, body, input, select, button, label {
            font-family: 'Inter-Latin', 'Kanit', sans-serif;
            box-sizing: border-box;
            /* ⚡ 120Hz Ultra Touch Optimization: ยกเลิก Tap Lag บน iOS / Android */
            touch-action: manipulation;
            -webkit-touch-callout: none;
        }

        /* 🔒 ✨ 800ms Synchronized Theme Transitions */
        .header-glass, .glass-card, .txt-title, .txt-subtitle, .txt-label, 
        .contestant-name, .contestant-nickname, input[type="date"], 
        #theme-toggle-btn, #theme-toggle-btn div {
            transition: background-color 0.8s cubic-bezier(0.4, 0, 0.2, 1),
                        border-color 0.8s cubic-bezier(0.4, 0, 0.2, 1),
                        color 0.8s cubic-bezier(0.4, 0, 0.2, 1),
                        box-shadow 0.8s cubic-bezier(0.4, 0, 0.2, 1),
                        text-shadow 0.8s cubic-bezier(0.4, 0, 0.2, 1),
                        transform 0.8s cubic-bezier(0.4, 0, 0.2, 1) !important;
        }

        /* 🔒 ล็อกสีพื้นหลัง HTML */
        html {
            background-color: #e0eaf5;
            min-height: 100%;
            overscroll-behavior-y: none;
            transition: background-color 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        html.dark {
            background-color: #0d0e15 !important;
        }

        body {
            color: #0f172a;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            margin: 0;
            padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
            transition: color 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            /* ⚡ GPU Compositing สำหรับ 120Hz Smooth Scrolling */
            -webkit-overflow-scrolling: touch;
            transform: translateZ(0);
            backface-visibility: hidden;
        }

        body.dark {
            color: #f1f5f9 !important;
        }

        /* ⚡ GPU Hardware-Accelerated Background Layers */
        .bg-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            will-change: opacity;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1) !important;
            transform: translateZ(0);
        }

        .bg-layer-light {
            background: radial-gradient(circle at 15% 50%, #cce0f5, #e0eaf5 25%, #f0f6fc 50%, #e0eaf5 75%, #cce0f5 100%);
            opacity: 1;
        }
        body.dark .bg-layer-light {
            opacity: 0;
        }

        .bg-layer-dark {
            background: radial-gradient(circle at 15% 50%, #1a1b26, #0d0e15 25%, #050505 50%, #0d0e15 75%, #1a1b26 100%);
            opacity: 0;
        }
        body.dark .bg-layer-dark {
            opacity: 1;
        }

        ::-webkit-scrollbar { display: none; }
        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* 📱 Fix iOS Input Date Styling */
        input[type="date"] {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            min-height: 42px;
        }
        input[type="date"]::-webkit-date-and-time-value {
            text-align: center;
            line-height: 1.4;
        }

        /* 🌫️ เลเยอร์เบลอขอบบนแบบ Fade Gradient */
        .blur-overlay-top {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: calc(100px + env(safe-area-inset-top));
            pointer-events: none;
            z-index: 30;
            backdrop-filter: blur(28px) saturate(190%);
            -webkit-backdrop-filter: blur(28px) saturate(190%);
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
            transform: translateZ(0);
        }

        /* 🌫️ เลเยอร์เบลอขอบล่างแบบ Fade Gradient */
        .blur-overlay-bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: calc(90px + env(safe-area-inset-bottom));
            pointer-events: none;
            z-index: 30;
            backdrop-filter: blur(28px) saturate(190%);
            -webkit-backdrop-filter: blur(28px) saturate(190%);
            -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
            mask-image: linear-gradient(to top, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
            transform: translateZ(0);
        }

        /* 🪞 Liquid Glass Styling */
        .header-glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(30px) saturate(200%);
            -webkit-backdrop-filter: blur(30px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            box-shadow: 0 10px 35px rgba(15, 23, 42, 0.08), inset 0 1px 0 rgba(255, 255, 255, 1);
            transform: translateZ(0);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(203, 213, 225, 0.8);
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(15, 23, 42, 0.05);
            transform: translateZ(0);
        }

        /* 💡 ⚡ GROUP NEON BADGES & HEADERS */
        .neon-badge-vq {
            color: #ffffff !important;
            background: #7e22ce !important;
            border: 1.5px solid rgba(216, 180, 254, 0.9);
            box-shadow: 0 0 14px rgba(168, 85, 247, 0.75), inset 0 0 10px rgba(255, 255, 255, 0.35);
            text-shadow: 0 0 6px #ffffff, 0 0 12px rgba(233, 213, 255, 0.95);
        }

        .neon-badge-vm {
            color: #ffffff !important;
            background: #1d4ed8 !important;
            border: 1.5px solid rgba(147, 197, 253, 0.9);
            box-shadow: 0 0 14px rgba(59, 130, 246, 0.75), inset 0 0 10px rgba(255, 255, 255, 0.35);
            text-shadow: 0 0 6px #ffffff, 0 0 12px rgba(191, 219, 254, 0.95);
        }

        .neon-badge-vw {
            color: #ffffff !important;
            background: #db2777 !important;
            border: 1.5px solid rgba(249, 168, 212, 0.9);
            box-shadow: 0 0 14px rgba(236, 72, 153, 0.75), inset 0 0 10px rgba(255, 255, 255, 0.35);
            text-shadow: 0 0 6px #ffffff, 0 0 12px rgba(251, 207, 232, 0.95);
        }

        /* 🎨 สัญลักษณ์วงกลมสีประจำคณะ */
        .fac-edu { background: #dc2626 !important; }
        .fac-health { background: #fa8072 !important; }
        .fac-innov { background: #8b4513 !important; }
        .fac-sci { background: #eab308 !important; }
        .fac-manage { background: #f97316 !important; }
        .fac-hum { background: #9333ea !important; }

        .connection-dot-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            cursor: pointer;
        }

        .connection-ping {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            opacity: 0.75;
            animation: pulse-beacon 1.8s cubic-bezier(0, 0, 0.2, 1) infinite;
            will-change: transform, opacity;
        }

        .connection-core {
            position: relative;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.75);
        }

        @keyframes pulse-beacon {
            0% { transform: scale(0.6); opacity: 0.9; }
            50% { transform: scale(1.6); opacity: 0.15; }
            100% { transform: scale(2.0); opacity: 0; }
        }

        /* 🎨 Custom Soft Shadows & Glow for Text */
        .txt-title {
            color: #0f172a !important;
            font-weight: 800;
            text-shadow: 0 2px 8px rgba(15, 23, 42, 0.12);
        }
        body.dark .txt-title {
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.25);
        }

        .txt-subtitle {
            color: #334155 !important;
            font-weight: 700;
        }

        .txt-label {
            color: #0f172a !important;
            font-weight: 800;
        }

        .contestant-name {
            color: #0f172a !important;
            font-weight: 800;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
        }
        body.dark .contestant-name {
            color: #ffffff !important;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.35), 0 2px 6px rgba(0, 0, 0, 0.5) !important;
        }

        .contestant-nickname {
            font-weight: 900;
        }

        .nickname-vq {
            color: #7e22ce !important;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.35);
        }
        body.dark .nickname-vq {
            color: #c084fc !important;
            text-shadow: 0 0 12px rgba(192, 132, 252, 0.65), 0 0 20px rgba(168, 85, 247, 0.3);
        }

        .nickname-vm {
            color: #1d4ed8 !important;
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.35);
        }
        body.dark .nickname-vm {
            color: #60a5fa !important;
            text-shadow: 0 0 12px rgba(96, 165, 250, 0.65), 0 0 20px rgba(59, 130, 246, 0.3);
        }

        .nickname-vw {
            color: #db2777 !important;
            text-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
        }
        body.dark .nickname-vw {
            color: #f472b6 !important;
            text-shadow: 0 0 12px rgba(244, 114, 182, 0.65), 0 0 20px rgba(236, 72, 153, 0.3);
        }

        .glass-button {
            background: linear-gradient(135deg, #1e40af 0%, #1d4ed8 100%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 25px rgba(30, 64, 175, 0.35);
            transition: transform 0.08s cubic-bezier(0, 0, 0.2, 1), filter 0.08s ease !important;
            will-change: transform;
        }
        .glass-button:active:not(:disabled) {
            transform: scale(0.97) translateZ(0);
            filter: brightness(0.95);
        }

        /* ⚡ Ultra Fast Touch Feedback for Radio Buttons (ตอบสนองการกด 50ms) */
        .session-btn input[type="radio"] { display: none; }
        .session-btn label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 9px 4px;
            border-radius: 14px;
            background: rgba(241, 245, 249, 0.9);
            border: 1.5px solid rgba(203, 213, 225, 0.9);
            font-size: clamp(12px, 3.2vw, 15px);
            font-weight: 800;
            color: #1e293b;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.08s ease, transform 0.06s ease, border-color 0.08s ease !important;
            will-change: transform;
        }
        .session-btn label:active {
            transform: scale(0.95);
        }
        .session-btn input:checked + label {
            background: #1e40af !important;
            border-color: #1e40af !important;
            color: #ffffff !important;
            box-shadow: 0 4px 14px rgba(30, 64, 175, 0.3);
        }

        /* Status Custom Radio Buttons */
        .status-radio input[type="radio"] { display: none; }
        .status-radio label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 1px;
            border-radius: 12px;
            border: 1.5px solid rgba(203, 213, 225, 0.9);
            background: #ffffff;
            font-size: clamp(12px, 3.4vw, 15px);
            font-weight: 800;
            color: #1e293b;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.08s ease, transform 0.06s ease, border-color 0.08s ease !important;
            will-change: transform;
        }
        .status-radio label:active {
            transform: scale(0.93);
        }

        @media (min-width: 640px) {
            .status-radio label {
                padding: 12px 6px;
                border-radius: 14px;
            }
            .session-btn label {
                padding: 10px 8px;
            }
        }

        /* High Contrast Checked States for Status */
        .status-radio input[value="มา"]:checked + label {
            background: #16a34a !important;
            border-color: #16a34a !important;
            color: #ffffff !important;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.35);
        }
        .status-radio input[value="มาสาย"]:checked + label {
            background: #d97706 !important;
            border-color: #d97706 !important;
            color: #ffffff !important;
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.35);
        }
        .status-radio input[value="ลา"]:checked + label {
            background: #0284c7 !important;
            border-color: #0284c7 !important;
            color: #ffffff !important;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.35);
        }
        .status-radio input[value="ขาด"]:checked + label {
            background: #dc2626 !important;
            border-color: #dc2626 !important;
            color: #ffffff !important;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.35);
        }

        /* 🌙 Dark Mode Support Overrides */
        body.dark .header-glass {
            background: rgba(15, 23, 42, 0.88) !important;
            backdrop-filter: blur(30px) saturate(200%) !important;
            -webkit-backdrop-filter: blur(30px) saturate(200%) !important;
            border-color: rgba(255, 255, 255, 0.12) !important;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6) !important;
        }
        body.dark .glass-card {
            background: rgba(30, 41, 59, 0.85) !important;
            border-color: rgba(255, 255, 255, 0.12) !important;
        }
        body.dark .txt-title { color: #f8fafc !important; }
        body.dark .txt-subtitle { color: #cbd5e1 !important; }
        body.dark .txt-label { color: #93c5fd !important; }

        body.dark input[type="date"] {
            background: rgba(15, 23, 42, 0.95) !important;
            border-color: rgba(255, 255, 255, 0.2) !important;
            color: #f1f5f9 !important;
        }

        body.dark .session-btn label {
            background: rgba(15, 23, 42, 0.7) !important;
            border-color: rgba(255, 255, 255, 0.15) !important;
            color: #64748b !important;
        }
        body.dark .session-btn input:checked + label {
            background: #2563eb !important;
            border-color: #60a5fa !important;
            color: #ffffff !important;
            box-shadow: 0 4px 18px rgba(37, 99, 235, 0.5) !important;
        }

        body.dark .status-radio label {
            background: rgba(15, 23, 42, 0.7);
            border-color: rgba(255, 255, 255, 0.15);
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <!-- ⚡ GPU Accelerated Background Fade Layers -->
    <div class="bg-layer bg-layer-light"></div>
    <div class="bg-layer bg-layer-dark"></div>

    <!-- 🌫️ เลเยอร์เบลอขอบบนและล่าง -->
    <div class="blur-overlay-top"></div>
    <div class="blur-overlay-bottom"></div>

    <!-- Container ปรับขยายขนาด responsive -->
    <div class="w-full max-w-2xl md:max-w-3xl lg:max-w-4xl mx-auto space-y-4 sm:space-y-5 relative">
        
        <!-- 📌 HEADER BOX -->
        <div class="header-glass p-3.5 sm:p-5 sticky top-2 sm:top-4 z-50">
            <div class="flex items-center justify-between mb-3 sm:mb-4 gap-2">
                <div class="flex items-center gap-2.5 sm:gap-4 min-w-0">
                    <div class="w-12 h-12 sm:w-20 sm:h-20 flex items-center justify-center shrink-0">
                        <img src="logo.png" alt="VRU Ambassador Logo" class="w-full h-full object-contain">
                    </div>
                    <div class="min-w-0">
                        <h1 class="text-base sm:text-2xl txt-title leading-tight truncate">ระบบเช็คชื่อรอบเก็บตัว</h1>
                        <p class="text-[11px] sm:text-sm txt-subtitle mt-0.5 truncate">VRU Ambassador 2026</p>
                    </div>
                </div>

                <!-- 🎛️ ปุ่มสไลด์โหมดสว่าง/โหมดมืด -->
                <button id="theme-toggle-btn" type="button" aria-label="Toggle Theme" class="relative w-14 h-7 sm:w-16 sm:h-8 rounded-full p-1 bg-slate-300/80 dark:bg-slate-700/80 border border-slate-400/50 dark:border-slate-600/50 flex items-center justify-between transition-colors shadow-inner shrink-0 cursor-pointer">
                    <span class="w-5 h-5 sm:w-6 sm:h-6 flex items-center justify-center z-10 text-white">
                        <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 text-white drop-shadow-sm" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="4"></circle>
                            <path stroke-linecap="round" d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"></path>
                        </svg>
                    </span>

                    <span class="w-5 h-5 sm:w-6 sm:h-6 flex items-center justify-center z-10 text-white">
                        <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 text-white drop-shadow-sm" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
                        </svg>
                    </span>

                    <div class="absolute top-1 left-1 w-5 h-5 sm:w-6 sm:h-6 rounded-full bg-white shadow-md transform translate-x-0 dark:translate-x-7 sm:dark:translate-x-8"></div>
                </button>
            </div>

            <!-- เลือกวันที่และช่วงเวลา -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 sm:gap-4">
                <div class="space-y-1">
                    <label for="checkDate" class="block text-[11px] sm:text-xs txt-label uppercase tracking-wide">เลือกวันที่</label>
                    <input type="date" id="checkDate" required class="w-full px-3 py-2 sm:p-3 rounded-2xl bg-white border border-slate-300 text-xs sm:text-sm font-extrabold text-slate-900 outline-none focus:ring-2 focus:ring-blue-600 shadow-inner text-center">
                </div>

                <div class="space-y-1">
                    <label class="block text-[11px] sm:text-xs txt-label uppercase tracking-wide">ช่วงเวลา</label>
                    <div class="grid grid-cols-2 gap-2 session-btn">
                        <div>
                            <input type="radio" id="session_morning" name="session" value="เช้า" checked>
                            <label for="session_morning">☀️ เช้า</label>
                        </div>
                        <div>
                            <input type="radio" id="session_afternoon" name="session" value="บ่าย">
                            <label for="session_afternoon">🌤️ บ่าย</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- FORM CONTAINER -->
        <form id="checkInForm" class="space-y-3.5 sm:space-y-5">
            <!-- 📋 CONTESTANTS CONTAINER -->
            <div id="contestantsContainer" class="space-y-3 sm:space-y-4 relative z-10"></div>

            <!-- 📌 SUBMIT BUTTON BOX -->
            <div class="header-glass p-3.5 sm:p-4 sticky bottom-2 sm:bottom-4 z-50">
                <button type="submit" id="submitBtn" class="glass-button w-full text-white font-black text-base sm:text-lg py-3 sm:py-4 rounded-2xl disabled:opacity-50 disabled:cursor-not-allowed">
                    บันทึกข้อมูล
                </button>
                <p id="statusMsg" class="text-center font-extrabold text-xs sm:text-sm mt-2 sm:mt-3"></p>
            </div>
        </form>

    </div>

    <script>
        // Web App URL จาก Google Apps Script
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwYKQRdul52f-wtB4fZkX6Rvbe3cLJ1eDLOWY2V6SyZt2UK1aCaf1LLrR55NjdjgmTvKA/exec';

        // ตั้งค่าวันที่เริ่มต้นให้เป็นวันปัจจุบัน
        document.getElementById('checkDate').valueAsDate = new Date();

        // ------------------ DARK MODE TOGGLE ------------------
        const themeToggleBtn = document.getElementById('theme-toggle-btn');
        const themeColorMeta = document.getElementById('theme-color-meta');
        const statusBarStyle = document.getElementById('status-bar-style');

        function enableDarkMode(isDark) {
            if (isDark) {
                document.documentElement.classList.add('dark');
                document.body.classList.add('dark');
                if (themeColorMeta) themeColorMeta.setAttribute('content', '#0d0e15');
                if (statusBarStyle) statusBarStyle.setAttribute('content', 'black-translucent');
                localStorage.setItem('checkin_theme', 'dark');
            } else {
                document.documentElement.classList.remove('dark');
                document.body.classList.remove('dark');
                if (themeColorMeta) themeColorMeta.setAttribute('content', '#e0eaf5');
                if (statusBarStyle) statusBarStyle.setAttribute('content', 'default');
                localStorage.setItem('checkin_theme', 'light');
            }
        }

        themeToggleBtn.addEventListener('click', () => enableDarkMode(!document.documentElement.classList.contains('dark')));
        if (localStorage.getItem('checkin_theme') === 'dark') enableDarkMode(true);

        // Map คณะ -> คลาสสีสัญลักษณ์วงกลม
        const facultyClasses = {
            "ครุศาสตร์": "fac-edu",
            "สาธารณสุขศาสตร์": "fac-health",
            "นวัตกรรมการจัดการ": "fac-innov",
            "วิทยาศาสตร์และเทคโนโลยี": "fac-sci",
            "วิทยาการจัดการ": "fac-manage",
            "มนุษยศาสตร์และสังคมศาสตร์": "fac-hum"
        };

        // ------------------ CONTESTANTS DATA ------------------
        const contestants = [
            { id: "VQ01", name: "คุณจารุกร เย็นประสพ", nickname: "ยีน", faculty: "ครุศาสตร์", group: "LGBTQIA+ VRU Ambassador 2026" },
            { id: "VQ02", name: "คุณธนพล กลิ่นหอม", nickname: "ธันย์", faculty: "มนุษยศาสตร์และสังคมศาสตร์", group: "LGBTQIA+ VRU Ambassador 2026" },
            { id: "VQ03", name: "คุณบูรพา จุฬา", nickname: "บลู", faculty: "สาธารณสุขศาสตร์", group: "LGBTQIA+ VRU Ambassador 2026" },
            { id: "VQ04", name: "คุณทินภัทร มะลิแย้ม", nickname: "เจมมี่", faculty: "มนุษยศาสตร์และสังคมศาสตร์", group: "LGBTQIA+ VRU Ambassador 2026" },
            { id: "VQ05", name: "คุณธัญญารัตน์ ปะโยม", nickname: "มด", faculty: "วิทยาการจัดการ", group: "LGBTQIA+ VRU Ambassador 2026" },
            { id: "VQ06", name: "คุณเบญจรัตน์ กรองมะเริง", nickname: "เบลล์", faculty: "วิทยาการจัดการ", group: "LGBTQIA+ VRU Ambassador 2026" },
            { id: "VQ07", name: "คุณนัฐวุฒิ ม่วงสุราช", nickname: "นัทนิสา", faculty: "ครุศาสตร์", group: "LGBTQIA+ VRU Ambassador 2026" },
            
            { id: "VM01", name: "นายธนพัต เพ็งผลา", nickname: "ออโต้", faculty: "สาธารณสุขศาสตร์", group: "Mister VRU Ambassador 2026" },
            { id: "VM02", name: "นายศุภวิทย์ เชื่อมมะรัง", nickname: "เหนือ", faculty: "นวัตกรรมการจัดการ", group: "Mister VRU Ambassador 2026" },
            { id: "VM03", name: "นายเกียรติศักดิ์ หกเจริญ", nickname: "บอส", faculty: "วิทยาศาสตร์และเทคโนโลยี", group: "Mister VRU Ambassador 2026" },
            { id: "VM04", name: "นายอนุรักษ์ ทองอินทร์", nickname: "บีมเมอร์", faculty: "ครุศาสตร์", group: "Mister VRU Ambassador 2026" },
            { id: "VM05", name: "นายอภิสันติธน ชีวางกูล", nickname: "ดีดี", faculty: "วิทยาการจัดการ", group: "Mister VRU Ambassador 2026" },
            
            { id: "VW01", name: "นางสาวกิ่งแก้ว ชิน", nickname: "ชมพู่", faculty: "วิทยาการจัดการ", group: "Miss VRU Ambassador 2026" },
            { id: "VW02", name: "นางสาวพิมพ์ภินันท์ บูรณ์เจริญ", nickname: "หงส์หยก", faculty: "ครุศาสตร์", group: "Miss VRU Ambassador 2026" },
            { id: "VW03", name: "นางสาวสุรางค์พิมล ฤทธิ์กัณโต", nickname: "ปะแป้ง", faculty: "มนุษยศาสตร์และสังคมศาสตร์", group: "Miss VRU Ambassador 2026" },
            { id: "VW04", name: "นางสาววนัชพร ช่วยบุญ", nickname: "วิว", faculty: "สาธารณสุขศาสตร์", group: "Miss VRU Ambassador 2026" },
            { id: "VW05", name: "นางสาวรัชนก งอยแพง", nickname: "เครป", faculty: "นวัตกรรมการจัดการ", group: "Miss VRU Ambassador 2026" },
            { id: "VW06", name: "นางสาวธนัญญา สีทองธนะวัฒน์", nickname: "เบลล์", faculty: "วิทยาศาสตร์และเทคโนโลยี", group: "Miss VRU Ambassador 2026" }
        ];

        const container = document.getElementById('contestantsContainer');
        let currentGroup = '';

        // Render Contestants Cards
        contestants.forEach((c) => {
            if (c.group !== currentGroup) {
                const groupTitle = document.createElement('div');
                let groupStyle = "";
                
                if (c.id.startsWith("VQ")) {
                    groupStyle = "neon-badge-vq";
                } else if (c.id.startsWith("VM")) {
                    groupStyle = "neon-badge-vm";
                } else if (c.id.startsWith("VW")) {
                    groupStyle = "neon-badge-vw";
                }

                groupTitle.className = `text-center text-sm sm:text-base md:text-lg font-black uppercase tracking-wider px-4 py-2.5 sm:py-3.5 rounded-2xl border mt-5 sm:mt-6 mb-3 shadow-lg ${groupStyle}`;
                groupTitle.innerText = c.group;
                container.appendChild(groupTitle);
                currentGroup = c.group;
            }

            let badgeClass = "";
            let nicknameClass = "";
            
            if (c.id.startsWith("VQ")) {
                badgeClass = "neon-badge-vq";
                nicknameClass = "nickname-vq";
            } else if (c.id.startsWith("VM")) {
                badgeClass = "neon-badge-vm";
                nicknameClass = "nickname-vm";
            } else if (c.id.startsWith("VW")) {
                badgeClass = "neon-badge-vw";
                nicknameClass = "nickname-vw";
            }

            const facClass = facultyClasses[c.faculty] || 'bg-slate-600';

            const card = document.createElement('div');
            card.className = 'glass-card p-3 sm:p-4 space-y-3 sm:space-y-3.5';
            
            card.innerHTML = `
                <div class="flex items-center justify-between gap-2">
                    <div class="flex items-center gap-2 sm:gap-3 min-w-0">
                        <span class="${badgeClass} px-2.5 py-1 sm:px-3.5 sm:py-1.5 rounded-xl font-black text-xs sm:text-base tracking-wide shrink-0">
                            ${c.id}
                        </span>
                        <span class="contestant-name text-sm sm:text-lg truncate">
                            ${c.name}
                        </span>
                        <div class="connection-dot-wrap" title="คณะ${c.faculty}">
                            <span class="connection-ping ${facClass}"></span>
                            <span class="connection-core ${facClass}"></span>
                        </div>
                    </div>
                    <span class="contestant-nickname text-base sm:text-xl shrink-0 pl-2 ${nicknameClass}">
                        ${c.nickname}
                    </span>
                </div>
                <div class="grid grid-cols-4 gap-1.5 sm:gap-2.5 status-radio">
                    <div>
                        <input type="radio" id="${c.id}_ma" name="${c.id}" value="มา" checked>
                        <label for="${c.id}_ma">มา</label>
                    </div>
                    <div>
                        <input type="radio" id="${c.id}_late" name="${c.id}" value="มาสาย">
                        <label for="${c.id}_late">มาสาย</label>
                    </div>
                    <div>
                        <input type="radio" id="${c.id}_leave" name="${c.id}" value="ลา">
                        <label for="${c.id}_leave">ลา</label>
                    </div>
                    <div>
                        <input type="radio" id="${c.id}_absent" name="${c.id}" value="ขาด">
                        <label for="${c.id}_absent">ขาด</label>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });

        // Form Submit Handler
        document.getElementById('checkInForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('statusMsg');
            
            btn.disabled = true;
            btn.innerText = 'กำลังบันทึกข้อมูล...';
            msg.innerText = '';

            const rawDate = document.getElementById('checkDate').value;
            let formattedDate = "";
            if (rawDate) {
                const parts = rawDate.split('-');
                const day = parseInt(parts[2], 10);
                const month = parseInt(parts[1], 10);
                const year = (parseInt(parts[0], 10) + 543) % 100;
                formattedDate = `${day}/${month}/${year}`;
            }

            const session = document.querySelector('input[name="session"]:checked').value;
            const checkInData = [];

            contestants.forEach(c => {
                const status = document.querySelector(`input[name="${c.id}"]:checked`).value;
                checkInData.push({ id: c.id, status: status });
            });

            const payload = {
                date: formattedDate,
                session: session,
                checkInData: checkInData
            };

            const formData = new FormData();
            formData.append('payload', JSON.stringify(payload));

            fetch(SCRIPT_URL, { method: 'POST', body: formData })
                .then(response => response.text())
                .then(result => {
                    msg.innerText = '✅ บันทึกข้อมูลสำเร็จ! (วันที่ ' + formattedDate + ' รอบ ' + session + ')';
                    msg.className = 'text-center font-black text-xs sm:text-sm mt-2 sm:mt-3 text-emerald-700 dark:text-emerald-400';
                    btn.disabled = false;
                    btn.innerText = 'บันทึกข้อมูล';
                })
                .catch(error => {
                    msg.innerText = '❌ เกิดข้อผิดพลาด: ' + error.message;
                    msg.className = 'text-center font-black text-xs sm:text-sm mt-2 sm:mt-3 text-rose-700 dark:text-rose-400';
                    btn.disabled = false;
                    btn.innerText = 'บันทึกข้อมูล';
                });
        });
    </script>
</body>
