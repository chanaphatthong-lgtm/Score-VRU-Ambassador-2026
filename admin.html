<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control - VRU Ambassador 2025</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- MQTT SDK เชื่อมต่อสัญญาณ Real-time -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <style>
        body {
            font-family: 'Noto Sans Thai', sans-serif;
            background: linear-gradient(135deg, #f0f7ff 0%, #d9ecff 100%);
            min-height: 100vh;
            transition: background 0.4s ease, color 0.4s ease;
        }

        ::-webkit-scrollbar {
            display: none;
            width: 0px;
            background: transparent;
        }
        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .liquid-glass {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
            transition: all 0.4s ease;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.9);
            transition: all 0.2s ease;
        }
        .glass-card:hover {
            background: rgba(255, 255, 255, 0.95);
            transform: translateY(-2px);
        }
        .active-card {
            background: rgba(219, 234, 254, 0.95) !important;
            border-color: rgba(30, 58, 138, 0.8) !important;
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.15);
        }

        .glass-button:active {
            transform: scale(0.97);
        }

        @keyframes slideInUp {
            0% { transform: translateY(100%); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        @keyframes slideInDown {
            0% { transform: translateY(-100%); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        .anim-slide-up {
            animation: slideInUp 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        .anim-slide-down {
            animation: slideInDown 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        #drag-handle-bar {
            touch-action: none;
        }

        #contestants-panel {
            overflow: hidden;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #contestants-panel.state-minimized {
            height: 54px !important;
            min-height: 54px !important;
            max-height: 54px !important;
            padding-top: 6px !important;
            padding-bottom: 6px !important;
        }
        
        #contestants-panel.state-minimized > *:not(#drag-handle-bar) {
            display: none !important;
        }

        #contestants-panel.state-expanded {
            position: absolute !important;
            top: 180px !important;
            bottom: 24px !important;
            right: 24px !important;
            left: 24px !important;
            z-index: 100 !important;
            height: auto !important;
            max-height: calc(100vh - 200px) !important;
            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.18) !important;
            background: rgba(241, 247, 255, 0.92) !important;
        }

        /* ----------------------------------------------------------------- */
        /* 🌙 DARK MODE STYLES (โหมดมืดสำหรับ Admin) */
        /* ----------------------------------------------------------------- */
        body.dark-mode {
            background: linear-gradient(135deg, #0b0f19 0%, #111827 100%);
            color: #f1f5f9;
        }

        body.dark-mode .liquid-glass {
            background: rgba(17, 24, 39, 0.65);
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        body.dark-mode .glass-card {
            background: rgba(31, 41, 55, 0.6);
            border-color: rgba(255, 255, 255, 0.1);
            color: #f3f4f6;
        }

        body.dark-mode .glass-card:hover {
            background: rgba(31, 41, 55, 0.85);
        }

        body.dark-mode .active-card {
            background: rgba(30, 58, 138, 0.6) !important;
            border-color: rgba(96, 165, 250, 0.8) !important;
        }

        body.dark-mode h1, 
        body.dark-mode h3, 
        body.dark-mode label,
        body.dark-mode #selected-name,
        body.dark-mode .judge-header-title {
            color: #93c5fd !important;
        }

        body.dark-mode #round-box-container, 
        body.dark-mode #selected-card {
            background: rgba(31, 41, 55, 0.7) !important;
            border-color: rgba(255, 255, 255, 0.15) !important;
        }

        body.dark-mode #round-display-text {
            color: #e2e8f0 !important;
        }

        body.dark-mode #search-input {
            background: rgba(17, 24, 39, 0.8) !important;
            border-color: rgba(255, 255, 255, 0.2) !important;
            color: #f1f5f9 !important;
        }

        body.dark-mode .header-bg-box {
            background: rgba(31, 41, 55, 0.7) !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
            color: #f3f4f6 !important;
        }

        body.dark-mode #contestants-panel.state-expanded {
            background: rgba(17, 24, 39, 0.95) !important;
        }

        body.dark-mode .contestant-name-text {
            color: #f1f5f9 !important;
        }
    </style>
</head>
<body class="text-slate-800 p-6 flex flex-col h-screen overflow-hidden relative">

    <!-- HEADER: ส่วนหัวระบบควบคุม + แสดงสถานะการเชื่อมต่อ MQTT -->
    <nav id="top-header" class="relative z-[60] liquid-glass rounded-3xl p-5 mb-4 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-4">
            <div class="w-14 h-14 rounded-full bg-blue-900 text-white flex items-center justify-center font-bold text-2xl shadow-lg shrink-0">
                ⚙️
            </div>
            <div>
                <h1 class="text-2xl font-bold text-blue-900">ระบบควบคุมการแข่งขัน (Admin Console)</h1>
            </div>
        </div>
        
        <div class="flex items-center gap-3">
            <!-- ปุ่มสลับโหมด Dark Mode / Light Mode -->
            <button id="theme-toggle-btn" class="header-bg-box bg-white/80 hover:bg-white text-blue-900 px-4 py-3 rounded-2xl border border-white shadow-sm flex items-center justify-center transition-all cursor-pointer">
                <span id="theme-icon-moon" class="text-lg">🌙</span>
                <span id="theme-icon-sun" class="text-lg hidden">☀️</span>
            </button>

            <button id="sync-sheet-btn" class="header-bg-box glass-button bg-white/80 hover:bg-white text-blue-900 px-4 py-3 rounded-2xl border border-white shadow-sm font-bold text-sm flex items-center gap-2 transition-all">
                <svg id="sync-icon" class="w-4 h-4 text-blue-900" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                รีเฟรชรายชื่อ
            </button>
            
            <div class="header-bg-box bg-white/70 px-4 py-3 rounded-2xl border border-white shadow-sm flex items-center gap-2">
                <div id="status-dot" class="w-3 h-3 rounded-full bg-yellow-500 animate-pulse"></div>
                <div id="connection-status" class="text-xs font-bold text-yellow-600 uppercase tracking-wide">กำลังเชื่อมต่อสัญญาณ...</div>
            </div>
        </div>
    </nav>

    <!-- JUDGES CONNECTION BAR: แถบตรวจติดตามเน็ตและสถานะกรรมการคนที่ 1 - 5 -->
    <div class="relative z-[55] liquid-glass rounded-3xl p-3.5 mb-5 shrink-0 flex items-center justify-between gap-3 overflow-x-auto">
        <div class="flex items-center gap-2 shrink-0 border-r border-blue-200/80 pr-4">
            <span class="judge-header-title text-xs font-black text-blue-900 uppercase tracking-wider flex items-center gap-1.5">
                📱 สถานะเครื่องกรรมการ
            </span>
            <span id="connected-count-badge" class="bg-blue-900 text-white text-[11px] font-bold px-2.5 py-0.5 rounded-full">
                0/5 พร้อมใช้งาน
            </span>
        </div>

        <!-- กล่องแสดงสถานะแบบเจาะจง 5 เครื่อง -->
        <div id="judges-status-grid" class="flex items-center gap-3 flex-1 justify-around min-w-[650px]">
            <!-- จะถูกสร้างผ่าน JavaScript (iPad 01 ถึง iPad 05) -->
        </div>
    </div>

    <!-- MAIN PANEL -->
    <main class="relative z-40 grid grid-cols-1 md:grid-cols-12 gap-5 flex-1 min-h-0">
        
        <!-- LEFT COLUMN -->
        <div class="md:col-span-5 flex flex-col gap-4 min-h-0">
            
            <!-- 1. เลือกรอบการแข่งขัน -->
            <div class="liquid-glass rounded-3xl p-5 shrink-0">
                <label class="block text-sm font-bold text-blue-900 mb-2">1. เลือกรอบการแข่งขัน</label>
                
                <div id="round-box-container" class="relative w-full bg-white/80 border-2 border-blue-200 rounded-2xl h-14 overflow-hidden flex items-center justify-center cursor-ns-resize shadow-inner select-none transition-colors hover:border-blue-400">
                    <div id="round-display-text" class="font-bold text-blue-900 text-center px-4 text-base">
                        รอบที่ 1: การแสดงเปิดตัวและแนะนำตัว
                    </div>

                    <select id="round-select" class="hidden">
                        <option value="รอบที่ 1">รอบที่ 1: การแสดงเปิดตัวและแนะนำตัว</option>
                        <option value="รอบที่ 2">รอบที่ 2: การ Speech ตามหัวข้องาน</option>
                        <option value="รอบที่ 3">รอบที่ 3: การตอบ Random Keyword</option>
                        <option value="รอบที่ 4">รอบที่ 4: การตอบคำถามจากซองคำถาม</option>
                        <option value="รอบที่ 5">รอบที่ 5: ตอบคำถาม Final</option>
                    </select>
                </div>
            </div>

            <!-- 2. ข้อมูลผู้เข้าแข่งขันที่เลือก + ปุ่มส่งคำสั่ง -->
            <div class="liquid-glass rounded-3xl p-6 flex-1 flex flex-col justify-between min-h-0 overflow-y-auto">
                <div class="space-y-4">
                    <label class="block text-sm font-bold text-blue-900">2. ผู้เข้าแข่งขันที่เลือกอยู่</label>
                    
                    <div id="selected-card" class="bg-white/80 border-2 border-blue-100 rounded-2xl p-4 shadow-inner">
                        <div class="flex items-center gap-4">
                            <div id="selected-badge" class="w-16 h-16 rounded-full bg-blue-900 text-white font-black text-2xl flex items-center justify-center shadow-md shrink-0">
                                ?
                            </div>
                            <div class="overflow-hidden flex-1">
                                <div id="selected-name" class="text-lg font-bold text-blue-900 truncate">กรุณาคลิกเลือกผู้แข่งขัน</div>
                                <div id="selected-info" class="text-xs text-slate-400 mt-1 truncate">เลือกจากตารางรายชื่อ</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-6 space-y-2 shrink-0">
                    <button id="send-command-btn" disabled class="glass-button w-full bg-blue-900/90 hover:bg-blue-900 disabled:bg-slate-300 disabled:text-slate-500 disabled:cursor-not-allowed text-white font-bold text-lg py-4 rounded-2xl shadow-[0_4px_15px_rgba(30,58,138,0.3)] transition-all flex justify-center items-center gap-2">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"></path></svg>
                        เปิดรับคะแนน / ปลดล็อก iPad ทั้งหมด
                    </button>

                    <button id="lock-screen-btn" class="w-full bg-rose-600/10 hover:bg-rose-600/20 text-rose-500 font-bold text-xs py-2.5 rounded-xl border border-rose-200/40 transition-all flex justify-center items-center gap-1.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                        สั่งล็อกหน้าจอ iPad ทั้งหมด
                    </button>
                </div>
            </div>

        </div>

        <!-- RIGHT COLUMN -->
        <div id="contestants-panel" class="md:col-span-7 liquid-glass rounded-3xl p-5 pt-2 flex flex-col min-h-0 relative">
            
            <div id="drag-handle-bar" class="w-full flex flex-col items-center justify-center pt-1 pb-2 cursor-grab active:cursor-grabbing group select-none shrink-0">
                <div class="w-20 h-2 bg-blue-500 group-hover:bg-blue-700 rounded-full transition-colors shadow-sm"></div>
                <span class="text-[10px] font-bold text-blue-800 mt-1 pointer-events-none">ลากขึ้น-ลง หรือคลิกเพื่อปรับขนาด</span>
            </div>

            <div id="panel-header-content" class="flex justify-between items-center mb-3 shrink-0 gap-3">
                <h3 class="text-lg font-bold text-blue-900 flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                    รายชื่อผู้เข้าแข่งขัน
                    <span id="contestant-count" class="bg-blue-100 text-blue-800 text-xs px-2.5 py-0.5 rounded-full font-bold">0 คน</span>
                </h3>

                <div id="search-input-box" class="shrink-0">
                    <input type="text" id="search-input" placeholder="ค้นหาหมายเลข / ชื่อ..." class="bg-white/80 border border-blue-200 rounded-xl px-4 py-2 text-sm outline-none focus:border-blue-500 w-52 shadow-inner">
                </div>
            </div>

            <div id="contestants-container" class="grid grid-cols-1 gap-2.5 overflow-y-auto pb-2 flex-1">
                <div class="text-center py-20 text-slate-500 flex flex-col items-center gap-2">
                    <div class="w-8 h-8 border-4 border-blue-900 border-t-transparent rounded-full animate-spin"></div>
                    <div>กำลังดึงข้อมูลจาก Google Sheets...</div>
                </div>
            </div>

        </div>

    </main>

    <!-- Script -->
    <script>
        // -----------------------------------------------------------------
        // ระบบสลับโหมดมืด Dark Mode
        // -----------------------------------------------------------------
        const themeToggleBtn = document.getElementById('theme-toggle-btn');
        const themeIconMoon = document.getElementById('theme-icon-moon');
        const themeIconSun = document.getElementById('theme-icon-sun');

        function enableDarkMode(isDark) {
            if (isDark) {
                document.body.classList.add('dark-mode');
                themeIconMoon.classList.add('hidden');
                themeIconSun.classList.remove('hidden');
                localStorage.setItem('admin_theme', 'dark');
            } else {
                document.body.classList.remove('dark-mode');
                themeIconMoon.classList.remove('hidden');
                themeIconSun.classList.add('hidden');
                localStorage.setItem('admin_theme', 'light');
            }
        }

        themeToggleBtn.addEventListener('click', () => {
            const isDark = !document.body.classList.contains('dark-mode');
            enableDarkMode(isDark);
        });

        if (localStorage.getItem('admin_theme') === 'dark') {
            enableDarkMode(true);
        }

        // -----------------------------------------------------------------
        // ตัวแปร Google Sheet ข้อมูลผู้แข่งขัน
        // -----------------------------------------------------------------
        const SHEET_ID = '1wXJcgOcb7-AB3LyzH-NejVgNLQ8JxCbEJ_vHta780r0';
        const SHEET_NAME = 'ใบคะแนนเช็คชื่อ';
        const SHEET_RANGE = 'A3:D32';

        let contestantsData = [];
        let selectedContestant = null;

        const contestantsContainer = document.getElementById('contestants-container');
        const contestantCount = document.getElementById('contestant-count');
        const searchInput = document.getElementById('search-input');
        const syncBtn = document.getElementById('sync-sheet-btn');
        const syncIcon = document.getElementById('sync-icon');

        const selectedBadge = document.getElementById('selected-badge');
        const selectedName = document.getElementById('selected-name');
        const selectedInfo = document.getElementById('selected-info');
        const sendCommandBtn = document.getElementById('send-command-btn');
        const lockScreenBtn = document.getElementById('lock-screen-btn');
        
        const statusDot = document.getElementById('status-dot');
        const connectionStatus = document.getElementById('connection-status');
        const judgesStatusGrid = document.getElementById('judges-status-grid');
        const connectedCountBadge = document.getElementById('connected-count-badge');

        // -----------------------------------------------------------------
        // ระบบติดตามสถานะเน็ตเครื่องกรรมการ 1 - 5 (iPad 01 - iPad 05)
        // -----------------------------------------------------------------
        const EXPECTED_JUDGES = [
            { id: 'iPad 01', label: 'คนที่ 1' },
            { id: 'iPad 02', label: 'คนที่ 2' },
            { id: 'iPad 03', label: 'คนที่ 3' },
            { id: 'iPad 04', label: 'คนที่ 4' },
            { id: 'iPad 05', label: 'คนที่ 5' }
        ];

        const judgeDevicesState = {};
        EXPECTED_JUDGES.forEach(j => {
            judgeDevicesState[j.id] = {
                id: j.id,
                label: j.label,
                lastSeen: 0,
                judgeName: ''
            };
        });

        function renderJudgesStatus() {
            const now = Date.now();
            let onlineCount = 0;

            judgesStatusGrid.innerHTML = EXPECTED_JUDGES.map(j => {
                const device = judgeDevicesState[j.id];
                const isOnline = (now - device.lastSeen) < 6000;
                
                if (isOnline) onlineCount++;

                return `
                    <div class="flex items-center gap-2.5 px-3 py-2 rounded-2xl border transition-all ${
                        isOnline 
                        ? 'bg-emerald-500/10 border-emerald-400/50 text-emerald-950 dark:text-emerald-300 shadow-sm' 
                        : 'bg-rose-500/10 border-rose-300/30 text-rose-900 dark:text-rose-400 opacity-60'
                    }">
                        <div class="relative flex items-center justify-center">
                            <span class="w-3 h-3 rounded-full ${isOnline ? 'bg-emerald-500 animate-pulse' : 'bg-rose-500'}"></span>
                        </div>
                        <div class="flex flex-col">
                            <div class="flex items-center gap-1.5 leading-none">
                                <span class="font-black text-xs">${j.id}</span>
                                <span class="text-[10px] font-bold text-slate-400">(${j.label})</span>
                            </div>
                            <span class="text-[10px] font-semibold ${isOnline ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-500'} mt-1">
                                ${isOnline ? '🟢 เชื่อมต่อแล้ว' : '🔴 ขาดการเชื่อมต่อ'}
                            </span>
                        </div>
                    </div>
                `;
            }).join('');

            connectedCountBadge.textContent = `${onlineCount}/5 พร้อมใช้งาน`;
            if (onlineCount === 5) {
                connectedCountBadge.className = "bg-emerald-600 text-white text-[11px] font-bold px-2.5 py-0.5 rounded-full shadow-sm";
            } else if (onlineCount > 0) {
                connectedCountBadge.className = "bg-amber-500 text-white text-[11px] font-bold px-2.5 py-0.5 rounded-full shadow-sm";
            } else {
                connectedCountBadge.className = "bg-slate-400 text-white text-[11px] font-bold px-2.5 py-0.5 rounded-full";
            }
        }

        setInterval(renderJudgesStatus, 2000);
        renderJudgesStatus();

        // -----------------------------------------------------------------
        // ระบบ MQTT Real-time Broker
        // -----------------------------------------------------------------
        const CMD_TOPIC = 'vru_pageant_2025/admin_cmd';
        const STATUS_TOPIC = 'vru_pageant_2025/device_status';

        const mqttClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');

        mqttClient.on('connect', () => {
            console.log('✅ Admin MQTT Connected!');
            statusDot.className = "w-3 h-3 rounded-full bg-green-500 animate-pulse shadow-[0_0_8px_rgba(34,197,94,0.8)]";
            connectionStatus.className = "text-xs font-bold text-green-600 uppercase tracking-wide";
            connectionStatus.textContent = 'ระบบพร้อมใช้งาน (MQTT ONLINE)';

            mqttClient.subscribe(STATUS_TOPIC, { qos: 0 });
        });

        mqttClient.on('message', (topic, message) => {
            if (topic === STATUS_TOPIC) {
                try {
                    const data = JSON.parse(message.toString());
                    if (data.deviceId && judgeDevicesState[data.deviceId]) {
                        judgeDevicesState[data.deviceId].lastSeen = Date.now();
                        judgeDevicesState[data.deviceId].judgeName = data.judgeName || '';
                        renderJudgesStatus();
                    }
                } catch (e) {
                    console.error('Error parsing device status:', e);
                }
            }
        });

        mqttClient.on('error', (err) => {
            console.error('MQTT Error:', err);
            statusDot.className = "w-3 h-3 rounded-full bg-red-500 animate-pulse";
            connectionStatus.className = "text-xs font-bold text-red-600 uppercase tracking-wide";
            connectionStatus.textContent = 'เชื่อมต่อสัญญาณขัดข้อง';
        });

        function sendMqttCommand(commandData) {
            localStorage.setItem('adminCommand', JSON.stringify(commandData));
            if (mqttClient.connected) {
                mqttClient.publish(CMD_TOPIC, JSON.stringify(commandData), { retain: true, qos: 1 });
            }
        }

        // -----------------------------------------------------------------
        // ระบบการเปลี่ยนรอบแบบ Animated Slide
        // -----------------------------------------------------------------
        const roundBoxContainer = document.getElementById('round-box-container');
        const roundDisplayText = document.getElementById('round-display-text');
        const roundSelect = document.getElementById('round-select');

        const roundsList = [
            { code: 'รอบที่ 1', label: 'รอบที่ 1: การแสดงเปิดตัวและแนะนำตัว' },
            { code: 'รอบที่ 2', label: 'รอบที่ 2: การ Speech ตามหัวข้องาน' },
            { code: 'รอบที่ 3', label: 'รอบที่ 3: การตอบ Random Keyword' },
            { code: 'รอบที่ 4', label: 'รอบที่ 4: การตอบคำถามจากซองคำถาม' },
            { code: 'รอบที่ 5', label: 'รอบที่ 5: ตอบคำถาม Final' }
        ];

        let currentRoundIdx = 0;

        function updateRoundIndex(newIdx, animDirection) {
            if (newIdx < 0 || newIdx >= roundsList.length || newIdx === currentRoundIdx) return;
            
            currentRoundIdx = newIdx;
            roundSelect.selectedIndex = currentRoundIdx;
            
            roundDisplayText.classList.remove('anim-slide-up', 'anim-slide-down');
            void roundDisplayText.offsetWidth;
            
            roundDisplayText.textContent = roundsList[currentRoundIdx].label;
            
            if (animDirection === 'up') {
                roundDisplayText.classList.add('anim-slide-up');
            } else {
                roundDisplayText.classList.add('anim-slide-down');
            }
        }

        roundBoxContainer.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (e.deltaY > 0) updateRoundIndex(currentRoundIdx + 1, 'up');
            else if (e.deltaY < 0) updateRoundIndex(currentRoundIdx - 1, 'down');
        }, { passive: false });

        let touchStartY = 0;
        roundBoxContainer.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) touchStartY = e.touches[0].clientY;
        }, { passive: true });

        roundBoxContainer.addEventListener('touchend', (e) => {
            if (!touchStartY || e.changedTouches.length !== 1) return;
            const diffY = touchStartY - e.changedTouches[0].clientY;
            
            if (Math.abs(diffY) > 20) {
                if (diffY > 0) updateRoundIndex(currentRoundIdx + 1, 'up');
                else updateRoundIndex(currentRoundIdx - 1, 'down');
            }
            touchStartY = 0;
        }, { passive: true });

        roundBoxContainer.addEventListener('click', () => {
            let nextIdx = (currentRoundIdx + 1) % roundsList.length;
            updateRoundIndex(nextIdx, 'up');
        });

        // -----------------------------------------------------------------
        // ระบบ Drag Handling (พาเนลรายชื่อ)
        // -----------------------------------------------------------------
        const contestantsPanel = document.getElementById('contestants-panel');
        const dragHandleBar = document.getElementById('drag-handle-bar');

        let currentState = 'normal';

        function setPanelState(newState) {
            currentState = newState;
            contestantsPanel.classList.remove('state-minimized', 'state-expanded');
            
            if (newState === 'minimized') contestantsPanel.classList.add('state-minimized');
            else if (newState === 'expanded') contestantsPanel.classList.add('state-expanded');
        }

        document.addEventListener('pointerdown', (e) => {
            if (currentState === 'expanded' && !contestantsPanel.contains(e.target)) {
                setPanelState('normal');
            }
        });

        let startYDrag = 0;
        let isDragging = false;
        let currentDeltaY = 0;

        dragHandleBar.addEventListener('pointerdown', (e) => {
            isDragging = true;
            startYDrag = e.clientY;
            currentDeltaY = 0;
            dragHandleBar.setPointerCapture(e.pointerId);
            contestantsPanel.style.transition = 'none';
        });

        dragHandleBar.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            currentDeltaY = startYDrag - e.clientY;
            contestantsPanel.style.transform = `translateY(${-currentDeltaY * 0.25}px)`;
        });

        dragHandleBar.addEventListener('pointerup', (e) => {
            if (!isDragging) return;
            isDragging = false;
            
            contestantsPanel.style.transition = '';
            contestantsPanel.style.transform = '';

            if (currentDeltaY > 40) {
                if (currentState === 'minimized') setPanelState('normal');
                else setPanelState('expanded');
            } else if (currentDeltaY < -40) {
                if (currentState === 'expanded') setPanelState('normal');
                else setPanelState('minimized');
            } else if (Math.abs(currentDeltaY) <= 10) {
                if (currentState === 'normal') setPanelState('expanded');
                else if (currentState === 'expanded') setPanelState('normal');
                else setPanelState('normal');
            }
        });

        // -----------------------------------------------------------------
        // ดึงข้อมูลผู้เข้าแข่งขันจาก Google Sheets
        // -----------------------------------------------------------------
        async function fetchContestants() {
            syncIcon.classList.add('animate-spin');
            contestantsContainer.innerHTML = `
                <div class="text-center py-20 text-slate-500 flex flex-col items-center gap-2">
                    <div class="w-8 h-8 border-4 border-blue-900 border-t-transparent rounded-full animate-spin"></div>
                    <div>กำลังดึงข้อมูลจาก Google Sheets...</div>
                </div>
            `;

            try {
                const gvizUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}&range=${encodeURIComponent(SHEET_RANGE)}`;
                const response = await fetch(gvizUrl);
                const text = await response.text();
                
                const jsonString = text.substring(47, text.length - 2);
                const data = JSON.parse(jsonString);

                contestantsData = [];

                if (data.table && data.table.rows) {
                    data.table.rows.forEach(row => {
                        if (row.c && row.c[0] && row.c[0].v) {
                            const code = String(row.c[0].v || '').trim();
                            const name = String(row.c[1] ? (row.c[1].v || '') : '').trim();
                            const nickname = String(row.c[2] ? (row.c[2].v || '') : '').trim();
                            const faculty = String(row.c[3] ? (row.c[3].v || '') : '').trim();

                            const isValidName = name !== '' && !name.includes('ชื่อ-นามสกุล') && !name.includes('ชื่อ - นามสกุล');

                            if (code !== '' && isValidName) {
                                contestantsData.push({ code, name, nickname, faculty });
                            }
                        }
                    });
                }

                contestantsData = contestantsData.slice(0, 30);
                renderContestants(contestantsData);
                contestantCount.textContent = `${contestantsData.length} คน`;

            } catch (err) {
                console.error('เกิดข้อผิดพลาดในการดึงข้อมูล:', err);
                contestantsContainer.innerHTML = `
                    <div class="text-center py-10 text-rose-600 bg-rose-50 border border-rose-200 rounded-2xl font-bold">
                        ⚠️ ดึงข้อมูลจาก Google Sheets ไม่สำเร็จ กรุณาตรวจสอบการแชร์ของชีท
                    </div>
                `;
            } finally {
                syncIcon.classList.remove('animate-spin');
            }
        }

        function renderContestants(list) {
            if (list.length === 0) {
                contestantsContainer.innerHTML = `<div class="text-center py-10 text-slate-500 font-bold">ไม่พบรายชื่อผู้เข้าแข่งขัน</div>`;
                return;
            }

            contestantsContainer.innerHTML = '';
            list.forEach(item => {
                const isSelected = selectedContestant && selectedContestant.code === item.code;
                const cardHTML = `
                    <div data-code="${item.code}" class="contestant-card glass-card p-3.5 rounded-2xl cursor-pointer flex items-stretch justify-between gap-4 ${isSelected ? 'active-card' : ''}">
                        <div class="flex items-center gap-3.5 overflow-hidden flex-1">
                            <div class="w-12 h-12 rounded-full bg-blue-900 text-white font-bold text-base flex items-center justify-center shrink-0 shadow">
                                ${item.code}
                            </div>
                            <div class="overflow-hidden">
                                <div class="contestant-name-text font-bold text-slate-800 text-base truncate leading-snug">
                                    ${item.name} ${item.nickname ? `<span class="text-slate-400 font-normal">(${item.nickname})</span>` : ''}
                                </div>
                                <div class="text-xs text-slate-400 truncate mt-0.5">${item.faculty || 'ไม่ระบุคณะ'}</div>
                            </div>
                        </div>
                        
                        <div class="shrink-0 flex items-stretch">
                            <button type="button" class="px-7 py-3 rounded-2xl border-2 font-black text-base shadow-sm transition-all flex items-center justify-center ${isSelected ? 'bg-blue-900 text-white border-blue-900 shadow-md scale-105' : 'bg-white/80 dark:bg-slate-800 hover:bg-blue-900 hover:text-white text-blue-900 dark:text-blue-300 border-blue-200/60'}">
                                ${isSelected ? 'เลือกแล้ว ✓' : 'เลือก'}
                            </button>
                        </div>
                    </div>
                `;
                contestantsContainer.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        contestantsContainer.addEventListener('click', (e) => {
            const card = e.target.closest('.contestant-card');
            if (card) selectContestant(card.dataset.code);
        });

        function selectContestant(code) {
            selectedContestant = contestantsData.find(c => c.code === code);
            if (selectedContestant) {
                selectedBadge.textContent = selectedContestant.code;
                selectedName.textContent = selectedContestant.name;
                selectedInfo.textContent = `ชื่อเล่น: ${selectedContestant.nickname || '-'} | คณะ: ${selectedContestant.faculty || '-'}`;
                
                sendCommandBtn.disabled = false;
                renderContestants(contestantsData);
            }
        }

        searchInput.addEventListener('input', function() {
            const q = this.value.toLowerCase().trim();
            const filtered = contestantsData.filter(item => 
                item.code.toLowerCase().includes(q) ||
                item.name.toLowerCase().includes(q) ||
                item.nickname.toLowerCase().includes(q) ||
                item.faculty.toLowerCase().includes(q)
            );
            renderContestants(filtered);
        });

        // ปุ่มปลดล็อก iPad
        sendCommandBtn.addEventListener('click', () => {
            if (!selectedContestant) return;

            const commandData = {
                action: 'START_VOTING',
                roundName: roundSelect.value,
                contestantName: `${selectedContestant.code} - ${selectedContestant.name}`,
                contestantNickname: selectedContestant.nickname || '',
                contestantCode: selectedContestant.code,
                contestantImage: `${selectedContestant.code}.png`,
                timestamp: new Date().getTime()
            };

            sendMqttCommand(commandData);

            const origText = sendCommandBtn.innerHTML;
            sendCommandBtn.innerHTML = `✅ ส่งสัญญาณปลดล็อกแล้ว!`;
            sendCommandBtn.classList.remove('bg-blue-900/90');
            sendCommandBtn.classList.add('bg-green-600');

            setTimeout(() => {
                sendCommandBtn.innerHTML = origText;
                sendCommandBtn.classList.remove('bg-green-600');
                sendCommandBtn.classList.add('bg-blue-900/90');
            }, 1500);
        });

        // ปุ่มสั่งล็อกหน้าจอ iPad
        lockScreenBtn.addEventListener('click', () => {
            const commandData = {
                action: 'LOCK_SCREEN',
                timestamp: new Date().getTime()
            };

            sendMqttCommand(commandData);
            alert('สั่งล็อกหน้าจอ iPad ทั้งหมดเรียบร้อยแล้ว');
        });

        syncBtn.addEventListener('click', fetchContestants);
        fetchContestants();
    </script>
</body>
</html>
