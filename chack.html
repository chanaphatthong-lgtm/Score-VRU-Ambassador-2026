<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" id="theme-color-meta" content="#e0eaf5">
    <title>เช็คชื่อรอบเก็บตัว - VRU Ambassador 2026</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=Kanit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        @font-face {
            font-family: 'Inter-Latin';
            src: local('Inter');
            unicode-range: U+0041-005A, U+0061-007A, U+0030-0039;
        }

        html, body, input, select, button {
            font-family: 'Inter-Latin', 'Kanit', sans-serif;
        }

        html {
            background-color: #e0eaf5;
            height: -webkit-fill-available;
        }

        body {
            background: radial-gradient(circle at 15% 50%, #cce0f5, #e0eaf5 25%, #f0f6fc 50%, #e0eaf5 75%, #cce0f5 100%);
            background-attachment: fixed;
            color: #0f172a;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            transition: background 0.4s ease, color 0.4s ease;
            padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        }

        ::-webkit-scrollbar { display: none; }
        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* 🪞 High-Legibility Liquid Glass Styling */
        .liquid-glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(15, 23, 42, 0.08), inset 0 1px 0 rgba(255, 255, 255, 1);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(203, 213, 225, 0.8);
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(15, 23, 42, 0.05);
            transition: all 0.2s ease;
        }

        /* 🎨 Force High-Contrast Text in Light Mode */
        .txt-title { color: #0f172a !important; font-weight: 800; }
        .txt-subtitle { color: #334155 !important; font-weight: 700; }
        .txt-label { color: #0f172a !important; font-weight: 800; }
        .contestant-name { color: #0f172a !important; font-weight: 800; }

        .glass-button {
            background: linear-gradient(135deg, #1e40af 0%, #1d4ed8 100%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 25px rgba(30, 64, 175, 0.35);
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .glass-button:active:not(:disabled) {
            transform: scale(0.97);
            filter: brightness(0.95);
        }

        /* Segmented Button for Time Session */
        .session-btn input[type="radio"] { display: none; }
        .session-btn label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            border-radius: 14px;
            background: rgba(241, 245, 249, 0.9);
            border: 1.5px solid rgba(203, 213, 225, 0.9);
            font-size: 15px;
            font-weight: 800;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .session-btn input:checked + label {
            background: #1e40af;
            border-color: #1e40af;
            color: #ffffff !important;
            box-shadow: 0 4px 14px rgba(30, 64, 175, 0.3);
        }

        /* Status Custom Radio Buttons */
        .status-radio input[type="radio"] { display: none; }
        .status-radio label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 11px 4px;
            border-radius: 14px;
            border: 1.5px solid rgba(203, 213, 225, 0.9);
            background: #ffffff;
            font-size: 15px;
            font-weight: 800;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        /* High Contrast Checked States */
        .status-radio input[value="มา"]:checked + label {
            background: #16a34a !important;
            border-color: #16a34a !important;
            color: #ffffff !important;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.35);
        }
        .status-radio input[value="มาสาย"]:checked + label {
            background: #d97706 !important;
            border-color: #d97706 !important;
            color: #ffffff !important;
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.35);
        }
        .status-radio input[value="ลา"]:checked + label {
            background: #0284c7 !important;
            border-color: #0284c7 !important;
            color: #ffffff !important;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.35);
        }
        .status-radio input[value="ขาด"]:checked + label {
            background: #dc2626 !important;
            border-color: #dc2626 !important;
            color: #ffffff !important;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.35);
        }

        /* 🌙 Dark Mode Support Overrides */
        html.dark, body.dark {
            background: radial-gradient(circle at 15% 50%, #1a1b26, #0d0e15 25%, #050505 50%, #0d0e15 75%, #1a1b26 100%) !important;
            color: #f1f5f9 !important;
        }
        body.dark .liquid-glass {
            background: rgba(25, 25, 30, 0.75) !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5) !important;
        }
        body.dark .glass-card {
            background: rgba(35, 35, 42, 0.85) !important;
            border-color: rgba(255, 255, 255, 0.12) !important;
        }
        body.dark .txt-title { color: #f8fafc !important; }
        body.dark .txt-subtitle { color: #cbd5e1 !important; }
        body.dark .txt-label { color: #93c5fd !important; }
        body.dark .contestant-name { color: #ffffff !important; }

        body.dark input[type="date"] {
            background: rgba(20, 20, 25, 0.9) !important;
            border-color: rgba(255, 255, 255, 0.2) !important;
            color: #f1f5f9 !important;
        }
        body.dark .session-btn label {
            background: rgba(20, 20, 25, 0.7);
            border-color: rgba(255, 255, 255, 0.15);
            color: #cbd5e1;
        }
        body.dark .status-radio label {
            background: rgba(20, 20, 25, 0.6);
            border-color: rgba(255, 255, 255, 0.15);
            color: #cbd5e1;
        }
    </style>
</head>
<body class="pb-12">

    <div class="max-w-2xl mx-auto space-y-5">
        
        <!-- HEADER BOX -->
        <div class="liquid-glass p-5 sticky top-4 z-50">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-4">
                    <!-- โลโก้ logo.png พื้นหลังวงกลมขนาดใหญ่ -->
                    <div class="w-20 h-20 rounded-full bg-white p-2 flex items-center justify-center shadow-md border-2 border-slate-200 dark:border-slate-700 shrink-0">
                        <img src="logo.png" alt="VRU Ambassador Logo" class="w-full h-full object-contain rounded-full">
                    </div>
                    <div>
                        <h1 class="text-xl sm:text-2xl txt-title leading-tight">ระบบเช็คชื่อรอบเก็บตัว</h1>
                        <p class="text-xs sm:text-sm txt-subtitle mt-0.5">VRU Ambassador 2026</p>
                    </div>
                </div>

                <!-- Dark Mode Toggle Button -->
                <button id="theme-toggle-btn" type="button" class="bg-white/90 dark:bg-black/50 hover:bg-white backdrop-blur-md px-3.5 py-2.5 rounded-2xl border border-slate-300 dark:border-white/10 shadow-sm flex items-center justify-center transition-all">
                    <span id="theme-icon-moon" class="text-base">🌙</span>
                    <span id="theme-icon-sun" class="text-base hidden">☀️</span>
                </button>
            </div>

            <!-- เลือกวันที่และช่วงเวลา -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div class="space-y-1">
                    <label for="checkDate" class="block text-xs txt-label uppercase tracking-wide">เลือกวันที่:</label>
                    <input type="date" id="checkDate" required class="w-full p-3 rounded-2xl bg-white border border-slate-300 text-sm font-extrabold text-slate-900 outline-none focus:ring-2 focus:ring-blue-600 transition-all shadow-inner">
                </div>

                <div class="space-y-1">
                    <label class="block text-xs txt-label uppercase tracking-wide">ช่วงเวลา:</label>
                    <div class="grid grid-cols-2 gap-2 session-btn">
                        <div>
                            <input type="radio" id="session_morning" name="session" value="เช้า" checked>
                            <label for="session_morning">☀️ เช้า</label>
                        </div>
                        <div>
                            <input type="radio" id="session_afternoon" name="session" value="บ่าย">
                            <label for="session_afternoon">🌤️ บ่าย</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- FORM CONTAINER -->
        <form id="checkInForm" class="space-y-5">
            <div id="contestantsContainer" class="space-y-4"></div>

            <!-- SUBMIT BUTTON -->
            <div class="liquid-glass p-4 sticky bottom-4 z-40">
                <button type="submit" id="submitBtn" class="glass-button w-full text-white font-black text-lg py-4 rounded-2xl disabled:opacity-50 disabled:cursor-not-allowed">
                    บันทึกข้อมูล
                </button>
                <p id="statusMsg" class="text-center font-extrabold text-sm mt-3"></p>
            </div>
        </form>

    </div>

    <script>
        // Web App URL จาก Google Apps Script ล่าสุดของคุณ
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwYKQRdul52f-wtB4fZkX6Rvbe3cLJ1eDLOWY2V6SyZt2UK1aCaf1LLrR55NjdjgmTvKA/exec';

        // ตั้งค่าวันที่เริ่มต้นให้เป็นวันปัจจุบัน
        document.getElementById('checkDate').valueAsDate = new Date();

        // ------------------ DARK MODE TOGGLE ------------------
        const themeToggleBtn = document.getElementById('theme-toggle-btn');
        const themeIconMoon = document.getElementById('theme-icon-moon');
        const themeIconSun = document.getElementById('theme-icon-sun');
        const themeColorMeta = document.getElementById('theme-color-meta');

        function enableDarkMode(isDark) {
            if (isDark) {
                document.documentElement.classList.add('dark');
                document.body.classList.add('dark');
                themeIconMoon.classList.add('hidden');
                themeIconSun.classList.remove('hidden');
                themeColorMeta.setAttribute('content', '#050505');
                localStorage.setItem('checkin_theme', 'dark');
            } else {
                document.documentElement.classList.remove('dark');
                document.body.classList.remove('dark');
                themeIconMoon.classList.remove('hidden');
                themeIconSun.classList.add('hidden');
                themeColorMeta.setAttribute('content', '#e0eaf5');
                localStorage.setItem('checkin_theme', 'light');
            }
        }
        themeToggleBtn.addEventListener('click', () => enableDarkMode(!document.body.classList.contains('dark')));
        if (localStorage.getItem('checkin_theme') === 'dark') enableDarkMode(true);

        // ------------------ CONTESTANTS DATA ------------------
        const contestants = [
            { id: "VQ01", name: "คุณจารุกร เย็นประสพ", group: "LGBTQIA+ (VQ)" },
            { id: "VQ02", name: "คุณธนพล กลิ่นหอม", group: "LGBTQIA+ (VQ)" },
            { id: "VQ03", name: "คุณบูรพา จุฬา", group: "LGBTQIA+ (VQ)" },
            { id: "VQ04", name: "คุณทินภัทร มะลิแย้ม", group: "LGBTQIA+ (VQ)" },
            { id: "VQ05", name: "คุณธัญญารัตน์ ปะโยม", group: "LGBTQIA+ (VQ)" },
            { id: "VQ06", name: "คุณเบญจรัตน์ กรองมะเริง", group: "LGBTQIA+ (VQ)" },
            { id: "VQ07", name: "คุณนัฐวุฒิ ม่วงสุราช", group: "LGBTQIA+ (VQ)" },
            { id: "VM01", name: "นายธนพัต เพ็งผลา", group: "Mister (VM)" },
            { id: "VM02", name: "นายศุภวิทย์ เชื่อมมะรัง", group: "Mister (VM)" },
            { id: "VM03", name: "นายเกียรติศักดิ์ หกเจริญ", group: "Mister (VM)" },
            { id: "VM04", name: "นายอนุรักษ์ ทองอินทร์", group: "Mister (VM)" },
            { id: "VM05", name: "นายอภิสันติธน ชีวางกูล", group: "Mister (VM)" },
            { id: "VW01", name: "นางสาวกิ่งแก้ว ชิน", group: "Miss (VW)" },
            { id: "VW02", name: "นางสาวพิมพ์ภินันท์ บูรณ์เจริญ", group: "Miss (VW)" },
            { id: "VW03", name: "นางสาวสุรางค์พิมล ฤทธิ์กัณโต", group: "Miss (VW)" },
            { id: "VW04", name: "นางสาววนัชพร ช่วยบุญ", group: "Miss (VW)" },
            { id: "VW05", name: "นางสาวรัชนก งอยแพง", group: "Miss (VW)" },
            { id: "VW06", name: "นางสาวธนัญญา สีทองธนะวัฒน์", group: "Miss (VW)" }
        ];

        const container = document.getElementById('contestantsContainer');
        let currentGroup = '';

        // Render Contestants Cards
        contestants.forEach((c) => {
            // สร้างหัวข้อกลุ่มแยกสี
            if (c.group !== currentGroup) {
                const groupTitle = document.createElement('div');
                let groupStyle = "";
                
                if (c.id.startsWith("VQ")) {
                    groupStyle = "bg-purple-100/90 dark:bg-purple-950/70 text-purple-900 dark:text-purple-300 border-purple-300 dark:border-purple-800";
                } else if (c.id.startsWith("VM")) {
                    groupStyle = "bg-blue-100/90 dark:bg-blue-950/70 text-blue-900 dark:text-blue-300 border-blue-300 dark:border-blue-800";
                } else if (c.id.startsWith("VW")) {
                    groupStyle = "bg-pink-100/90 dark:bg-pink-950/70 text-pink-900 dark:text-pink-300 border-pink-300 dark:border-pink-800";
                }

                groupTitle.className = `text-xs font-black uppercase tracking-wider px-3 py-2 rounded-xl border mt-5 mb-2 shadow-sm ${groupStyle}`;
                groupTitle.innerText = c.group;
                container.appendChild(groupTitle);
                currentGroup = c.group;
            }

            // กำหนดสีชิปป้ายรหัสหมายเลข (VQ=สีม่วง, VM=สีน้ำเงิน, VW=สีชมพู)
            let badgeBg = "";
            if (c.id.startsWith("VQ")) {
                badgeBg = "bg-purple-700 text-white shadow-purple-900/20";
            } else if (c.id.startsWith("VM")) {
                badgeBg = "bg-blue-700 text-white shadow-blue-900/20";
            } else if (c.id.startsWith("VW")) {
                badgeBg = "bg-pink-600 text-white shadow-pink-900/20";
            }

            const card = document.createElement('div');
            card.className = 'glass-card p-4 space-y-3.5';
            card.innerHTML = `
                <div class="flex items-center gap-3">
                    <!-- ป้ายรหัสหมายเลขขนาดใหญ่ ปรับสีตามประเภท VQ / VM / VW -->
                    <span class="px-3.5 py-1.5 rounded-xl ${badgeBg} font-black text-sm sm:text-base shadow-md tracking-wide shrink-0">
                        ${c.id}
                    </span>
                    <span class="contestant-name text-base sm:text-lg">
                        ${c.name}
                    </span>
                </div>
                <div class="grid grid-cols-4 gap-2 status-radio">
                    <div>
                        <input type="radio" id="${c.id}_ma" name="${c.id}" value="มา" checked>
                        <label for="${c.id}_ma">มา</label>
                    </div>
                    <div>
                        <input type="radio" id="${c.id}_late" name="${c.id}" value="มาสาย">
                        <label for="${c.id}_late">มาสาย</label>
                    </div>
                    <div>
                        <input type="radio" id="${c.id}_leave" name="${c.id}" value="ลา">
                        <label for="${c.id}_leave">ลา</label>
                    </div>
                    <div>
                        <input type="radio" id="${c.id}_absent" name="${c.id}" value="ขาด">
                        <label for="${c.id}_absent">ขาด</label>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });

        // Form Submit Handler
        document.getElementById('checkInForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('statusMsg');
            
            btn.disabled = true;
            btn.innerText = 'กำลังบันทึกข้อมูล...';
            msg.innerText = '';

            const rawDate = document.getElementById('checkDate').value;
            let formattedDate = "";
            if (rawDate) {
                const parts = rawDate.split('-');
                const day = parseInt(parts[2], 10);
                const month = parseInt(parts[1], 10);
                const year = (parseInt(parts[0], 10) + 543) % 100;
                formattedDate = `${day}/${month}/${year}`;
            }

            const session = document.querySelector('input[name="session"]:checked').value;
            const checkInData = [];

            contestants.forEach(c => {
                const status = document.querySelector(`input[name="${c.id}"]:checked`).value;
                checkInData.push({ id: c.id, status: status });
            });

            const payload = {
                date: formattedDate,
                session: session,
                checkInData: checkInData
            };

            const formData = new FormData();
            formData.append('payload', JSON.stringify(payload));

            fetch(SCRIPT_URL, { method: 'POST', body: formData })
                .then(response => response.text())
                .then(result => {
                    msg.innerText = '✅ บันทึกข้อมูลสำเร็จ! (วันที่ ' + formattedDate + ' รอบ ' + session + ')';
                    msg.className = 'text-center font-black text-sm mt-3 text-emerald-700 dark:text-emerald-400';
                    btn.disabled = false;
                    btn.innerText = 'บันทึกข้อมูล';
                })
                .catch(error => {
                    msg.innerText = '❌ เกิดข้อผิดพลาด: ' + error.message;
                    msg.className = 'text-center font-black text-sm mt-3 text-rose-700 dark:text-rose-400';
                    btn.disabled = false;
                    btn.innerText = 'บันทึกข้อมูล';
                });
        });
    </script>
</body>
</html>
